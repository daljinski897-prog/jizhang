<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>记账小管家</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%23111214'/></svg>">
<style>
:root{--primary:#111214;--primary-hover:#000000;--primary-light:#F1F2F4;--bg:#F2F3F5;--surface:#FFFFFF;--border:#E9EAEC;--text:#0F1012;--text-sub:#6B7280;--text-mute:#9CA3AF;--success:#16A34A;--danger:#DC2626;--r-sm:8px;--r-md:14px;--r-lg:22px;--shadow-sm:0 1px 2px rgba(17,18,20,.04),0 8px 20px rgba(17,18,20,.05);--shadow-lg:0 14px 36px rgba(17,18,20,.14);--max-w:480px;--nav-h:66px;--font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--mono:"SF Mono","JetBrains Mono",monospace}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;max-width:var(--max-w);margin:0 auto;min-height:100vh;font-size:14px;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#FFFFFF 0%,#F8F9FB 34%,#E3E7EC 100%)}
body::after{content:'';position:fixed;top:-18%;left:50%;transform:translateX(-50%);width:132%;height:56%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 68%);filter:blur(36px)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit}
svg{display:block}
.app{background:transparent;min-height:100vh;padding-bottom:calc(var(--nav-h)+72px);position:relative}
.top-bar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:none;padding:14px 20px 10px}
.top-bar__row{display:flex;align-items:center;justify-content:space-between}
.top-bar__title{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px;letter-spacing:-0.02em}
.top-bar__title svg{width:22px;height:22px;color:var(--text)}
.top-bar__date{font-size:12px;color:var(--text-sub);margin-top:2px}
.top-bar__btns{display:flex;align-items:center;gap:8px;flex-shrink:0}
.top-bar__btn{height:34px;padding:0 12px;border-radius:999px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;background:var(--surface);color:var(--text);border:1px solid var(--border);white-space:nowrap;box-shadow:var(--shadow-sm)}
.top-bar__btn svg{width:17px;height:17px}
.top-bar__btn--cfg{background:var(--surface);color:var(--text)}
.top-bar__btn:active{transform:scale(.94)}
.backup-note{font-size:12px;color:var(--text-sub);line-height:1.6}
.backup-note b{color:var(--text-main)}
.import-status{margin-top:8px;font-size:13px;font-weight:600}
.import-status--ok{color:var(--success)}
.import-status--err{color:#DC2626}
.config-filepick{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--border,#D6D3D1);border-radius:var(--r-md);background:#FAFAF9;color:var(--primary);font-size:14px;font-weight:700;cursor:pointer;text-align:center}
.config-filepick svg{width:18px;height:18px}
.config-filepick:active{background:var(--primary-light,#E6F4F1)}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:1}
#app.app--intro .reveal{animation:reveal .35s ease-out both}
.summary-card{background:var(--surface);margin:14px 16px 0;border-radius:var(--r-lg);padding:20px 8px;box-shadow:var(--shadow-sm);display:flex}
.summary-item{flex:1;text-align:center;position:relative}
.summary-item+.summary-item::before{content:'';position:absolute;left:0;top:15%;bottom:15%;width:1px;background:var(--border)}
.summary-item__num{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-0.03em}
.summary-item__num--expense{color:var(--danger)}
.summary-item__num--income{color:var(--success)}
.summary-item__num--neutral{color:var(--text)}
.summary-item__label{font-size:11px;color:var(--text-sub);margin-top:4px}
/* 底部液态玻璃胶囊导航栏 */
.tab-bar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:calc(var(--max-w) - 32px);height:64px;border-radius:999px;background:rgba(255,255,255,.6);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 32px rgba(17,18,20,.12),inset 0 1px 0 rgba(255,255,255,.9);display:flex;align-items:stretch;z-index:200;padding:0 8px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(15,16,18,.38);transition:color .25s}
.tab-item svg{width:21px;height:21px;stroke-width:1.7}
.tab-item__label{font-size:10px;font-weight:600;line-height:1;letter-spacing:.02em}
.tab-item.active{color:var(--text)}
.tab-item.active svg{stroke-width:2.2}
.tab-item.active .tab-item__label{font-weight:800}
.tab-item--center{flex:0 0 72px}
.soon-toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:rgba(17,18,20,.85);color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:400;animation:fadeIn .2s ease;backdrop-filter:blur(8px)}
/* 底部液态变形加号按钮（FAB）：径向扇形展开（上/左/右三个圆），SVG goo 滤镜产生水滴拉伸的黏稠感，无全屏遮罩 */
.create-fab{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:260;width:200px;height:150px;transform:translateX(-50%);pointer-events:none}
.create-fab__goo{position:absolute;inset:0;filter:url(#gooFab) drop-shadow(0 10px 26px rgba(242,153,61,.35))}
/* goo 层纯色圆：只负责黏液轮廓与拉丝（渐变会被滤镜模糊平均化，故不放在这层） */
.goo-blob{position:absolute;left:74px;top:90px;width:52px;height:52px;border-radius:50%;background:#FBC169}
/* 清晰渐变圆盘层（不过滤镜）：中心深橙、边缘浅黄的太阳感，与 blob 同步运动 */
.create-fab__discs{position:absolute;inset:0;pointer-events:none}
.goo-disc{position:absolute;left:76px;top:92px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#F5A73C 0%,#FBC169 52%,#FFE3AC 100%)}
.goo-blob--base{left:70px;top:86px;width:60px;height:60px}
.goo-disc--base{left:72px;top:88px;width:56px;height:56px}
.goo-blob,.goo-disc,.create-fab__item{transition:left .6s cubic-bezier(.55,.1,.3,1.4),top .6s cubic-bezier(.55,.1,.3,1.4),transform .6s cubic-bezier(.55,.1,.3,1.4),opacity .3s ease}
.create-fab--open .goo-blob--top,.create-fab--open .create-fab__item--top{left:74px;top:2px}
.create-fab--open .goo-disc--top{left:76px;top:4px}
.create-fab--open .goo-blob--left,.create-fab--open .create-fab__item--left{left:5px;top:34px}
.create-fab--open .goo-disc--left{left:7px;top:36px}
.create-fab--open .goo-blob--right,.create-fab--open .create-fab__item--right{left:144px;top:34px}
.create-fab--open .goo-disc--right{left:146px;top:36px}
.create-fab--open .goo-blob--top,.create-fab--open .goo-disc--top,.create-fab--open .create-fab__item--top{transition-delay:0s}
.create-fab--open .goo-blob--left,.create-fab--open .goo-disc--left,.create-fab--open .create-fab__item--left{transition-delay:.05s}
.create-fab--open .goo-blob--right,.create-fab--open .goo-disc--right,.create-fab--open .create-fab__item--right{transition-delay:.1s}
.create-fab--closing .goo-blob,.create-fab--closing .goo-disc,.create-fab--closing .create-fab__item{transition-delay:0s;transition-duration:.3s,.3s,.3s,.15s}
.create-fab__main{position:absolute;left:70px;top:86px;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:auto}
.create-fab__main svg{width:28px;height:28px;stroke-width:2.4;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.create-fab--open .create-fab__main svg{transform:rotate(45deg)}
/* 子按钮（图标层，黄色渐变圆由 goo 层提供）：与对应 blob 同步径向弹出 */
.create-fab__item{position:absolute;left:74px;top:90px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transform:scale(.2);pointer-events:none}
.create-fab__item svg{width:22px;height:22px;stroke-width:2.1}
.create-fab__item:active{opacity:.8}
.create-fab--open .create-fab__item{opacity:1;transform:scale(1);pointer-events:auto}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;overscroll-behavior:contain}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:100%;max-width:var(--max-w);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.22,1,.36,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal__title{font-size:17px;font-weight:700;text-align:center;margin-bottom:16px}
.voice-panel{text-align:center;padding:16px 0 8px}
.voice-orb{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;transition:all .3s;cursor:pointer}
.voice-orb--idle{background:var(--bg);border:2px solid var(--border)}
.voice-orb--idle svg{width:36px;height:36px;color:var(--text-mute)}
.voice-orb--recording{background:rgba(220,38,38,.08);border:2px solid var(--danger);animation:ripple 1.5s infinite}
.voice-orb--recording svg{width:36px;height:36px;color:var(--danger)}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(220,38,38,.3)}100%{box-shadow:0 0 0 22px rgba(220,38,38,0)}}
.voice-hint{font-size:13px;color:var(--text-sub)}
.voice-transcript{margin:14px 0;padding:14px;background:var(--bg);border-radius:var(--r-md);font-size:15px;min-height:48px;color:var(--text-mute);text-align:center;transition:color .2s}
.voice-transcript--active{color:var(--text);text-align:left;border:1px solid var(--border)}
.parsed-preview{margin:12px 0;padding:14px;background:var(--primary-light);border-radius:var(--r-md)}
.parsed-preview__title{font-size:12px;color:var(--primary-hover);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.parsed-preview__title svg{width:16px;height:16px}
.parsed-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(13,148,136,.12)}
.parsed-row:last-child{border-bottom:none}
.parsed-row__left{display:flex;align-items:center;gap:8px;font-size:14px}
.parsed-row__amt{font-family:var(--mono);font-size:14px;font-weight:700}
.parsed-row__amt--expense{color:var(--danger)}
.parsed-row__amt--income{color:var(--success)}
.field{margin-bottom:14px}
.field__label{display:block;font-size:12px;color:var(--text-sub);margin-bottom:6px;font-weight:500}
.field__input,.field__select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);font-size:15px;background:var(--bg);outline:none}
.field__input:focus,.field__select:focus{border-color:var(--primary)}
.type-toggle{display:flex;gap:8px}
.type-toggle__btn{flex:1;padding:11px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:1px solid var(--border);color:var(--text-sub);background:var(--surface)}
.type-toggle__btn--active{border-color:var(--primary);color:#fff;background:var(--primary)}
.btn{width:100%;padding:14px;border-radius:var(--r-md);font-size:15px;font-weight:600;transition:transform .12s,opacity .15s}
.btn--primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(17,18,20,.18)}
.btn--primary:active{transform:scale(.985)}
.btn--outline{border:1px solid var(--border);color:var(--text);background:var(--surface)}
.btn--outline:active{transform:scale(.985)}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.tx-list{padding:12px 16px 0}
.page-record{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.page-record .top-bar{position:static;flex-shrink:0}
.page-record .summary-card{flex-shrink:0}
.tx-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + 84px);position:relative}
.stats-spacer{height:calc(var(--nav-h) + 84px);flex-shrink:0}
.tx-date-group{font-size:12px;color:var(--text-sub);margin:14px 0 6px;font-weight:600;display:flex;justify-content:space-between}
.tx-item{background:var(--surface);border-radius:var(--r-md);padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);transition:transform .08s}
.tx-item:active{transform:scale(.985)}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#F3F4F6;color:var(--text)}
.tx-icon svg{width:20px;height:20px}
.tx-body{flex:1;min-width:0}
.tx-note{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--text-sub);margin-top:1px}
.tx-amount{font-family:var(--mono);font-size:16px;font-weight:700;flex-shrink:0}
.tx-amount--expense{color:var(--danger)}
.tx-amount--income{color:var(--success)}
.tx-delete{color:var(--danger);font-size:12px;padding:6px 8px;flex-shrink:0}
.empty{text-align:center;padding:64px 20px;color:var(--text-mute)}
.empty svg{width:48px;height:48px;margin:0 auto 12px}
.empty p{font-size:14px}
.empty__hint{font-size:12px;margin-top:8px}
.dim-toggle{display:flex;gap:6px;padding:12px 16px 0}
.dim-toggle__btn{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:14px;color:var(--text-sub);font-weight:600}
.dim-toggle__btn--active{background:var(--primary);color:#fff;border-color:var(--primary)}
.period-picker-wrap{padding:10px 16px 4px}
.period-picker{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:16px;color:var(--text-primary);box-sizing:border-box}
.period-picker:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.month-selector{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 8px;scrollbar-width:none}
.month-selector::-webkit-scrollbar{display:none}
.month-chip{padding:6px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:13px;white-space:nowrap;flex-shrink:0;color:var(--text-sub)}
.month-chip--active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 水滴日期转盘：从导航按钮向上生长的水滴，最宽处三同心滚轮环（外日·中月·内年） */
.tear-dial{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:280px;height:340px;z-index:250;pointer-events:none;touch-action:none;-webkit-user-select:none;user-select:none}
.tear-dial--open{pointer-events:auto}
.tear-dial__body{position:absolute;inset:0;transform:scale(.15);opacity:0;transform-origin:50% 98%;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .22s ease}
.tear-dial--open .tear-dial__body{transform:scale(1);opacity:1}
.tear-dial__body svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 14px 34px rgba(17,18,20,.16))}
/* 账户页 */
.acct-page{padding:16px}
.acct-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:6px 18px 10px;margin-bottom:14px}
.acct-card__title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;padding:14px 0 10px}
.acct-card__title svg{width:18px;height:18px}
.acct-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--border);font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
.acct-row svg{width:18px;height:18px;color:var(--text-sub);flex-shrink:0}
.acct-row__desc{font-size:11px;color:var(--text-mute);font-weight:400;margin-top:2px}
.acct-row:active{opacity:.7}
/* 无记录提示弹窗（右上角带 × 关闭） */
.alert-modal{position:relative;text-align:center;padding:26px 22px 22px}
.alert-modal__x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-sub);background:var(--bg)}
.alert-modal__x svg{width:16px;height:16px}
.alert-modal__icon{width:54px;height:54px;border-radius:50%;background:var(--bg);color:var(--text-sub);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.alert-modal__icon svg{width:26px;height:26px}
.alert-modal__title{font-size:16px;font-weight:700}
.alert-modal__msg{font-size:13px;color:var(--text-sub);margin-top:6px;line-height:1.7}
.chart-card{background:var(--surface);border-radius:var(--r-lg);padding:18px;margin:0 16px 14px;box-shadow:var(--shadow-sm)}
.chart-card__title{font-size:13px;color:var(--text-sub);margin-bottom:12px;display:flex;align-items:center;gap:6px;font-weight:600}
.chart-card__title svg{width:16px;height:16px}
.chart-svg{width:100%}
.cat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.cat-row:last-child{border-bottom:none}
.cat-row__left{display:flex;align-items:center;gap:8px;font-size:14px}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-row__amt{font-family:var(--mono);font-weight:600}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:rgba(28,25,23,.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:20000;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.hint-box{margin-top:14px;padding:12px;background:var(--bg);border-radius:var(--r-md);font-size:12px;color:var(--text-sub);line-height:1.8}
.voice-status{padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin:10px 0;display:none}
.voice-status--show{display:block}
.voice-status--error{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
.voice-status--ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#166534}
.voice-status--warn{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E}
.text-input-area{margin:10px 0}
.text-input-area textarea{width:100%;min-height:80px;padding:12px 14px;border:2px solid var(--border);border-radius:var(--r-md);font-size:16px;line-height:1.6;background:var(--bg);outline:none;resize:none;font-family:var(--font)}
.text-input-area textarea:focus{border-color:var(--primary)}
.text-input-area textarea::placeholder{color:var(--text-mute)}
@media(min-width:481px){.app{box-shadow:0 0 0 1px var(--border)}}
.mapping-list{margin:8px 0 12px}
.mapping-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:6px;background:var(--bg)}
.mapping-item__left{display:flex;align-items:center;gap:8px;font-size:14px;flex:1;min-width:0}
.mapping-item__kw{font-weight:600;color:var(--text)}
.mapping-item__arrow{color:var(--text-mute);font-size:12px}
.mapping-item__cat{font-size:13px;color:var(--primary);font-weight:600}
.mapping-item__type{font-size:11px;padding:2px 6px;border-radius:4px;margin-left:4px}
.mapping-item__type--expense{background:#FEF2F2;color:#DC2626}
.mapping-item__type--income{background:#F0FDF4;color:#16A34A}
.mapping-empty{text-align:center;padding:20px;color:var(--text-mute);font-size:13px}
.mapping-entry-row{display:flex;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg);margin:8px 0 14px;gap:12px}
.mapping-entry-row__left{display:flex;align-items:center;gap:10px;font-size:15px;flex:1;min-width:0}
.mapping-entry-row__title{font-weight:700;color:var(--text);font-size:15px}
.mapping-entry-row__count{font-size:12px;color:var(--text-mute);padding:2px 8px;background:var(--surface);border-radius:999px;margin-left:2px}
.mapping-entry-row__btn{padding:4px 12px;font-size:15px;font-weight:600;color:#fff;background:var(--primary);border:none;border-radius:var(--r-md);box-shadow:0 1px 4px rgba(13,148,136,.3);line-height:1.4;white-space:nowrap;cursor:pointer;flex-shrink:0;transition:opacity .15s}
.mapping-entry-row__btn:hover{opacity:.9}
.mapping-entry-row__btn:active{opacity:.75}
.dup-note{background:var(--bg);border-radius:var(--r-md);padding:14px;margin-bottom:16px;font-size:14px;color:var(--text-sub);line-height:1.8}
.dup-note__title{font-weight:700;color:var(--text);margin-bottom:8px}
.dup-note__row{display:flex;align-items:center;gap:8px;margin:4px 0}
.dup-note__row svg{width:16px;height:16px;flex-shrink:0}
.dup-note__tag{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:600;flex-shrink:0}
.dup-note__tag--old{background:#F1F5F9;color:#475569}
.dup-note__tag--new{background:#EFF6FF;color:#2563EB}
.dup-note__tip{margin-top:10px;font-size:12px;color:var(--text-mute);line-height:1.7}
.mapping-list-scroll{max-height:55vh;overflow-y:auto;overflow-x:hidden;padding:4px 2px 4px;margin:8px 0 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
.mapping-list-scroll .mapping-item{margin:6px 8px}
.detail-modal{max-height:50vh;display:flex;flex-direction:column;overflow:hidden}
.detail-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:4px 0 12px}
.detail-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-row__body{flex:1;min-width:0}
.detail-row__note{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-row__meta{font-size:12px;color:var(--text-mute);margin-top:2px}
.detail-total{font-size:13px;font-weight:400;color:var(--text-sub);margin-left:6px}
.detail-sub{font-size:13px;font-weight:400;color:var(--text-mute);margin-left:6px}
.cat-row--clickable{cursor:pointer;transition:background .12s}
.cat-row--clickable:hover{background:var(--bg)}
.cat-row--clickable:active{background:var(--border)}
.modal-overlay--top{z-index:10000}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
</style>

  var result=0,section=0,num=0;
  for(var i=0;i<chars.length;i++){

    else if(v===1000){section+=(num||1)*1000;num=0}
    else if(v===10000){result+=(section+num)*10000;section=0;num=0}
  }
  var val=result+section+num;
  return val>0?val:null;
}

// 按金额边界分段：一句连记多笔、中间无标点时，在上一笔金额结束处切开
function splitByAmounts(text){

function smartSegment(text){

      var imported=Array.isArray(data)?data:(data&&data.app==='aiBill'&&Array.isArray(data.txs)?data.txs:null);
      if(!imported)throw new Error('不是有效的记账备份文件');
      imported=imported.filter(function(t){return t&&typeof t.amount==='number'&&t.category&&t.date});
      var current=JSON.parse(localStorage.getItem('aiBillTxs')||'[]');
      var seen={},merged=[];
      current.forEach(function(t){if(t.id!==undefined)seen[t.id]=1;merged.push(t)});
      var added=0;
      imported.forEach(function(t){
        if(t.id!==undefined){if(seen[t.id])return;seen[t.id]=1}
        if(t.id===undefined)t.id=Date.now()+Math.random()+added;
        merged.push(t);added++;
      });
      merged.sort(function(a,b){return(b.timestamp||0)-(a.timestamp||0)});
      localStorage.setItem('aiBillTxs',JSON.stringify(merged));
      state.txs=merged;
      if(data&&data.app==='aiBill'&&Array.isArray(data.mappings)){
        var curMaps=JSON.parse(localStorage.getItem('aiBillMappings')||'[]');
        var mapSeen={},mapMerged=[];
        curMaps.forEach(function(m){if(m.id!==undefined)mapSeen[m.id]=1;mapMerged.push(m)});
        data.mappings.forEach(function(m){if(m.id!==undefined&&mapSeen[m.id])return;if(m.id===undefined)m.id=Date.now()+Math.random();mapMerged.push(m)});
        localStorage.setItem('aiBillMappings',JSON.stringify(mapMerged));
      }
      state.importStatus={type:'ok',msg:'恢复成功：新增 '+added+' 条，当前共 '+merged.length+' 条记录'};
      render();
      showToast('恢复成功，共 '+merged.length+' 条');
    }catch(err){
      state.importStatus={type:'err',msg:'导入失败：'+err.message};
      render();
    }
  };
  reader.onerror=function(){state.importStatus={type:'err',msg:'读取文件失败，请重试'};render()};
  reader.readAsText(file);
}

// ========== App State ==========
var state={tab:'record',txs:[],isRecording:false,voiceModal:false,entryMode:'auto',transcript:'',parsedRecords:[],manualModal:false,configModal:false,importStatus:null,selectedMonth:new Date().toISOString().slice(0,7),recordPeriod:new Date().toISOString().slice(0,7),recordDay:null,statDim:'month',statPeriod:new Date().toISOString().slice(0,7),toast:'',form:{type:'expense',amount:'',category:'餐饮',note:''},voiceStatus:'',voiceStatusType:'',mappingModal:false,mappingListModal:false,mappingForm:{type:'expense',keyword:'',category:'餐饮'}};

// ========== Voice Engine v4 ==========
var recognition=null,wantRecording=false,finalTranscript='',restartTimer=null,noResultTimer=null;

function getSpeechSupport(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return{supported:false,reason:'不支持'};
  return{supported:true,reason:window.isSecureContext?'安全环境':'非安全环境'};
}

function createRecognition(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  var r=new SR();
  r.lang='zh-CN';
  r.continuous=false;
  r.interimResults=true;
  r.maxAlternatives=1;
  return r;
}

function startVoice(){
  var sp=getSpeechSupport();
  if(!sp.supported){
    state.voiceStatus='当前浏览器不支持语音识别。请用下方输入框打字，或用Chrome浏览器打开。';
    state.voiceStatusType='error';
    render();
    setTimeout(function(){
      var ta=document.getElementById('text-input');
      if(ta)ta.focus();
    },300);
    return;
  }

  finalTranscript='';
  wantRecording=true;
  state.isRecording=true;
  state.transcript='';
  state.parsedRecords=[];
  state.voiceStatus='';
  state.voiceStatusType='';
  render();

  // Create a fresh recognition object each time
  recognition=createRecognition();
  if(!recognition){
    state.voiceStatus='语音引擎初始化失败，请用下方输入框打字';
    state.voiceStatusType='error';
    state.isRecording=false;
    wantRecording=false;
    render();
    return;
  }

  recognition.onstart=function(){
    state.voiceStatus='正在聆听...请说话';
    state.voiceStatusType='ok';
    updateVoiceStatus();
    // Set timer: if no result in 5 seconds, show hint
    if(noResultTimer)clearTimeout(noResultTimer);
    noResultTimer=setTimeout(function(){
      if(wantRecording&&!finalTranscript){
        state.voiceStatus='未检测到语音。请确认麦克风已开启，或用下方输入框打字';
        state.voiceStatusType='warn';
        updateVoiceStatus();
      }
    },5000);
  };

  recognition.onresult=function(e){
    var interim='';
    for(var i=0;i<e.results.length;i++){
      if(e.results[i].isFinal){
        finalTranscript+=e.results[i][0].transcript;
      }else{
        interim+=e.results[i][0].transcript;
      }
    }
    state.transcript=finalTranscript+interim;
    var el=document.querySelector('.voice-transcript');
    if(el){
      if(state.transcript){
        el.classList.add('voice-transcript--active');
        el.textContent=state.transcript;
      }
    }
    if(finalTranscript){
      apiParseIncremental(finalTranscript);
    }
    if(noResultTimer){clearTimeout(noResultTimer);noResultTimer=null}
  };

  recognition.onerror=function(e){
    if(e.error==='no-speech')return;
    if(e.error==='aborted')return;
    var msg='';
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      msg='麦克风权限被拒绝。请在浏览器设置中允许麦克风权限，或用下方输入框打字';
    }else if(e.error==='network'){
      msg='网络错误，语音识别需要联网。请检查网络或用下方输入框打字';
    }else if(e.error==='audio-capture'){
      msg='无法访问麦克风，请检查设备';
    }else{
      msg='语音不可用（'+e.error+'），请用下方输入框打字';
    }
    state.voiceStatus=msg;
    state.voiceStatusType='error';
    wantRecording=false;
    state.isRecording=false;
    render();
  };

  recognition.onend=function(){
    if(noResultTimer){clearTimeout(noResultTimer);noResultTimer=null}
    if(wantRecording){
      // Auto-restart to keep listening (simulates continuous mode)
      restartTimer=setTimeout(function(){
        if(wantRecording){
          try{
            recognition.start();
          }catch(err){
            wantRecording=false;
            state.isRecording=false;
            state.voiceStatus='语音中断，请用下方输入框打字';
            state.voiceStatusType='warn';
            render();
          }
        }
      },100);
    }else{
      state.isRecording=false;
      render();
    }
  };

  try{
    recognition.start();
  }catch(e){
    state.voiceStatus='语音启动失败，请用下方输入框打字';
    state.voiceStatusType='error';
    wantRecording=false;
    state.isRecording=false;
    render();
    setTimeout(function(){
      var ta=document.getElementById('text-input');
      if(ta)ta.focus();
    },300);
  }
}

function stopVoice(){
  wantRecording=false;
  if(restartTimer){clearTimeout(restartTimer);restartTimer=null}
  if(noResultTimer){clearTimeout(noResultTimer);noResultTimer=null}
  if(recognition){try{recognition.stop()}catch(e){}}
  state.isRecording=false;
  render();
}

function updateVoiceStatus(){
  var el=document.getElementById('voice-status');
  if(el&&state.voiceStatus){
    el.className='voice-status voice-status--'+state.voiceStatusType+' voice-status--show';
    el.innerHTML=(state.voiceStatusType==='ok'?icon('check-circle',16):state.voiceStatusType==='warn'?icon('alert-circle',16):icon('info',16))+' '+state.voiceStatus;
  }
}

function openVoiceModal(mode){

function textInputChange(val){

  else{

    if(modal){
      var c=modal.querySelector('.parsed-preview');if(c)c.remove();

  }
}
function handleEnterKey(e){
  if(e.key!=='Enter'||e.isComposing||e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
  e.preventDefault();
  var ta=document.getElementById('text-input'),val=ta?ta.value:state.transcript;
  if(!val||!val.trim()){showToast('请输入内容');return}
  parseVoiceToTransactions(val,state.entryMode).then(function(res){
    state.parsedRecords=res.transactions;
    if(res.transactions.length){confirmParsed()}
    else{showToast('未识别到金额，请检查输入')}
  });
}

function apiParseIncremental(text){
  parseVoiceToTransactions(text,state.entryMode).then(function(res){
    state.parsedRecords=res.transactions;
    var modal=document.querySelector('.modal');
    if(!modal)return;
    var container=modal.querySelector('.parsed-preview');
    var btnConfirm=modal.querySelector('.btn--primary');
    if(!res.transactions.length){
      if(container)container.remove();
      if(btnConfirm)btnConfirm.setAttribute('disabled','');
      return;
    }
    var html='<div class="parsed-preview__title">'+icon('sparkles',16)+' AI解析结果（共'+res.transactions.length+'笔）</div>';
    for(var i=0;i<res.transactions.length;i++){
      var r=res.transactions[i];
      var meta=CATEGORY_META[r.category]||CATEGORY_META['其他'];
      var cls=r.type==='income'?'parsed-row__amt--income':'parsed-row__amt--expense';
      html+='<div class="parsed-row"><div class="parsed-row__left">'+icon(meta.icon,18)+' '+r.category+' · '+r.note+'</div><div class="parsed-row__amt '+cls+'">'+(r.type==='income'?'+':'-')+'¥'+r.amount.toFixed(2)+'</div></div>';
    }
    var tEl=modal.querySelector('.voice-transcript');
    if(container)container.innerHTML=html;
    else if(tEl){container=document.createElement('div');container.className='parsed-preview';container.innerHTML=html;tEl.after(container)}
    if(btnConfirm)btnConfirm.removeAttribute('disabled');
  });
}

function confirmParsed(){
  if(!state.parsedRecords.length)return;
  var now=new Date(),date=now.toISOString().slice(0,10),time=now.toTimeString().slice(0,5);
  var ps=[];
  for(var i=0;i<state.parsedRecords.length;i++){
    var r=state.parsedRecords[i];
    ps.push(saveTransaction({type:r.type,amount:r.amount,category:r.category,note:r.note,date:date,time:time,timestamp:now.getTime()}));
  }
  Promise.all(ps).then(function(){
    state.txs=JSON.parse(localStorage.getItem('aiBillTxs')||'[]');
    stopVoice();
    state.voiceModal=false;
    state.recordPeriod=date.slice(0,7);   // 新增记录为当月，切回该月以便立即可见
    render();   // 关闭语音弹窗并刷新列表（showToast 已不再触发 render）
    showToast('成功记录 '+state.parsedRecords.length+' 笔账目');
  });
}

function $(sel){return document.querySelector(sel)}
function todayStr(){var d=new Date(),wk=['日','一','二','三','四','五','六'];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk[d.getDay()]}
function monthLabel(ym){var p=ym.split('-');return p[0]+'年'+parseInt(p[1])+'月'}
function showToast(msg){
  // 直接以 DOM 注入方式显示提示，不触发整体 render，避免打断已打开的弹层（防闪烁）
  var old=document.querySelector('.toast');

  var el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  if(showToast._timer)clearTimeout(showToast._timer);
  showToast._timer=setTimeout(function(){var e=document.querySelector('.toast');if(e&&e.parentNode)e.parentNode.removeChild(e)},2000);
}

function getMonthExpense(ym){ym=ym||new Date().toISOString().slice(0,7);var s=0;for(var i=0;i<state.txs.length;i++)if(state.txs[i].type==='expense'&&state.txs[i].date.startsWith(ym))s+=state.txs[i].amount;return s}
function getMonthIncome(ym){ym=ym||new Date().toISOString().slice(0,7);var s=0;for(var i=0;i<state.txs.length;i++)if(state.txs[i].type==='income'&&state.txs[i].date.startsWith(ym))s+=state.txs[i].amount;return s}
function getDaySum(day,type){var s=0;for(var i=0;i<state.txs.length;i++)if(state.txs[i].type===type&&state.txs[i].date===day)s+=state.txs[i].amount;return s}
// 按年月筛选后的分组（记账页只展示选中月份，不再全量累计）
function getGroupedTxs(ym){var g={};for(var i=0;i<state.txs.length;i++){var t=state.txs[i];if(ym&&t.date.slice(0,7)!==ym)continue;if(!g[t.date])g[t.date]={date:t.date,items:[],expense:0,income:0};g[t.date].items.push(t);if(t.type==='expense')g[t.date].expense+=t.amount;else if(t.type==='income')g[t.date].income+=t.amount}return Object.keys(g).sort(function(a,b){return b.localeCompare(a)}).map(function(k){var o=g[k],p=o.date.split('-'),wk=['日','一','二','三','四','五','六'];o.dateStr=parseInt(p[1])+'月'+parseInt(p[2])+'日 星期'+wk[new Date(o.date).getDay()];return o})}
// 记账页：年份列表（有数据的年份 ∪ 当前年）
function getRecordYears(){var y={};y[new Date().toISOString().slice(0,4)]=true;for(var i=0;i<state.txs.length;i++)y[state.txs[i].date.slice(0,4)]=true;return Object.keys(y).sort(function(a,b){return b.localeCompare(a)})}
// ========== 水滴日期转盘：长按"明细"从导航按钮向上生长，底部三同心半圆环（外日·中月·内年），选择实时联动页面 ==========
var __dialSel__=null;        // {years:[], yi:年索引, m:月(1-12), d:日索引(0=无)}
var __scrollToDate__=null;   // 选到具体日后需要滚动到的日期 YYYY-MM-DD
var __dialOpen__=false;

// 日环取值：0=无（展示整月），1..N=该月全部天（N 由年月决定，闰年二月自动 29）
function __dialDays__(){
  if(!__dialSel__)return [0];
  var y=parseInt(__dialSel__.years[__dialSel__.yi],10),n=new Date(y,__dialSel__.m,0).getDate();
  var arr=[0];for(var i=1;i<=n;i++)arr.push(i);
  return arr;
}
// 环段标签：年=2026 等，月=1-12，日=无/1..N
function __tearLabel__(ring,k){
  if(ring===0)return __dialSel__.years[k];
  if(ring===1)return String(k+1);
  var days=__dialDays__();return k===0?'无':String(days[k]);
}
// 滚轮式半圆环（仿手环表盘精致风格）：选中=黄描边黑色圆角胶囊+大白字，两侧数字渐隐缩小，日环外缘刻度线
var TEAR_CX=150,TEAR_CY=180;
var TEAR_R=[[14,32],[40,58],[66,90]]; // [年,月,日] 内外半径（日环最外，位于水滴最宽处）
function __tearSegA__(ring){return ring===0?50:22}
function __tearRingPaths__(ring,n,off){
  if(!n||n<=0)return '';
  var segA=__tearSegA__(ring),r=TEAR_R[ring],out='';
  var win=segA*2.6,tm=(r[0]+r[1])/2,th=r[1]-r[0];
  var fs=ring===2?20:(ring===1?18:11);
  for(var k=0;k<n;k++){
    var c=(k-off)*segA;
    if(c<-win||c>win)continue;
    if(Math.abs(c)<segA*0.7)continue; // 选中胶囊覆盖区不画白段
    var fade=Math.max(0,1-Math.abs(c)/win);
    var a0=(90-c+segA/2)*Math.PI/180,a1=(90-c-segA/2)*Math.PI/180;
    var x0o=(TEAR_CX+r[1]*Math.cos(a0)).toFixed(2),y0o=(TEAR_CY-r[1]*Math.sin(a0)).toFixed(2);
    var x1o=(TEAR_CX+r[1]*Math.cos(a1)).toFixed(2),y1o=(TEAR_CY-r[1]*Math.sin(a1)).toFixed(2);
    var x1i=(TEAR_CX+r[0]*Math.cos(a1)).toFixed(2),y1i=(TEAR_CY-r[0]*Math.sin(a1)).toFixed(2);
    var x0i=(TEAR_CX+r[0]*Math.cos(a0)).toFixed(2),y0i=(TEAR_CY-r[0]*Math.sin(a0)).toFixed(2);
    var op=(0.3+0.7*fade).toFixed(2);
    out+='<path d="M'+x0o+' '+y0o+' A'+r[1]+' '+r[1]+' 0 0 0 '+x1o+' '+y1o+' L'+x1i+' '+y1i+' A'+r[0]+' '+r[0]+' 0 0 1 '+x0i+' '+y0i+' Z" fill="#FFFFFF" stroke="rgba(240,241,243,.9)" stroke-width="1.1" opacity="'+op+'" onclick="__dialPick__('+ring+','+k+')" style="cursor:pointer"/>';
    // 日环外缘刻度线（仿表盘刻度）
    if(ring===2){
      var ta=(90-c)*Math.PI/180;
      out+='<line x1="'+(TEAR_CX+(r[1]+3)*Math.cos(ta)).toFixed(1)+'" y1="'+(TEAR_CY-(r[1]+3)*Math.sin(ta)).toFixed(1)+'" x2="'+(TEAR_CX+(r[1]+8)*Math.cos(ta)).toFixed(1)+'" y2="'+(TEAR_CY-(r[1]+8)*Math.sin(ta)).toFixed(1)+'" stroke="rgba(154,160,168,'+(0.55*fade).toFixed(2)+')" stroke-width="1.4" stroke-linecap="round" pointer-events="none"/>';
    }
    var am=(90-c)*Math.PI/180;
    var tx=(TEAR_CX+tm*Math.cos(am)).toFixed(1),ty=(TEAR_CY-tm*Math.sin(am)+fs*0.36).toFixed(1);
    var tf=Math.max(13,Math.round(fs*(0.8+0.2*fade)));
    out+='<text x="'+tx+'" y="'+ty+'" text-anchor="middle" font-size="'+tf+'" font-weight="600" fill="#6B7078" opacity="'+op+'" pointer-events="none">'+__tearLabel__(ring,k)+'</text>';
  }
  // 选中胶囊：黄描边 + 黑色圆角胶囊（弧线 round-cap 描边法）
  var aS=(90+segA/2)*Math.PI/180,aE=(90-segA/2)*Math.PI/180;
  var cx0=(TEAR_CX+tm*Math.cos(aS)).toFixed(2),cy0=(TEAR_CY-tm*Math.sin(aS)).toFixed(2);
  var cx1=(TEAR_CX+tm*Math.cos(aE)).toFixed(2),cy1=(TEAR_CY-tm*Math.sin(aE)).toFixed(2);
  var capD='M'+cx0+' '+cy0+' A'+tm+' '+tm+' 0 0 0 '+cx1+' '+cy1;
  out+='<path d="'+capD+'" fill="none" stroke="rgba(247,169,75,.95)" stroke-width="'+(th+3)+'" stroke-linecap="round"/>';
  out+='<path d="'+capD+'" fill="none" stroke="#17181A" stroke-width="'+(th-1)+'" stroke-linecap="round" onclick="__dialPick__('+ring+','+Math.round(off)+')" style="cursor:pointer"/>';
  var stf=ring===0?13:fs+5;
  out+='<text x="'+TEAR_CX+'" y="'+(TEAR_CY-tm+stf*0.36).toFixed(1)+'" text-anchor="middle" font-size="'+stf+'" font-weight="800" fill="#FFFFFF" pointer-events="none">'+__tearLabel__(ring,Math.round(off))+'</text>';
  return out;
}
