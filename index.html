<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>记账小管家</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%230D9488'/></svg>">
<style>
:root{--primary:#0D9488;--primary-hover:#0F766E;--primary-light:#CCFBF1;--bg:#FAFAF7;--surface:#FFFFFF;--border:#E7E5E0;--text:#1C1917;--text-sub:#78716C;--text-mute:#A8A29E;--success:#16A34A;--danger:#DC2626;--r-sm:6px;--r-md:10px;--r-lg:16px;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--max-w:480px;--nav-h:56px;--font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--mono:"SF Mono","JetBrains Mono",monospace}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;max-width:var(--max-w);margin:0 auto;min-height:100vh;font-size:14px;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit}
svg{display:block}
.app{background:radial-gradient(ellipse at 20% -5%,rgba(13,148,136,.05) 0%,transparent 55%),radial-gradient(ellipse at 85% 8%,rgba(245,158,11,.04) 0%,transparent 45%),var(--bg);min-height:100vh;padding-bottom:calc(var(--nav-h)+72px);position:relative}
.top-bar{position:sticky;top:0;z-index:100;background:rgba(250,250,247,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 20px 10px}
.top-bar__row{display:flex;align-items:center;justify-content:space-between}
.top-bar__title{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px;letter-spacing:-0.02em}
.top-bar__title svg{width:22px;height:22px;color:var(--primary)}
.top-bar__date{font-size:12px;color:var(--text-sub);margin-top:2px}
.top-bar__add{width:36px;height:36px;border-radius:var(--r-md);background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.reveal{animation:reveal .35s ease-out both}
.summary-card{background:var(--surface);margin:12px 16px 0;border-radius:var(--r-lg);padding:18px 8px;box-shadow:var(--shadow-sm);border:1px solid var(--border);display:flex}
.summary-item{flex:1;text-align:center;position:relative}
.summary-item+.summary-item::before{content:'';position:absolute;left:0;top:15%;bottom:15%;width:1px;background:var(--border)}
.summary-item__num{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-0.03em}
.summary-item__num--expense{color:var(--danger)}
.summary-item__num--income{color:var(--success)}
.summary-item__num--neutral{color:var(--text)}
.summary-item__label{font-size:11px;color:var(--text-sub);margin-top:4px}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max-w);height:var(--nav-h);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:200}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-mute);font-size:11px;transition:color .2s}
.tab-item svg{width:22px;height:22px;stroke-width:1.75}
.tab-item.active{color:var(--primary)}
.tab-item.active svg{stroke-width:2}
.fab{position:fixed;bottom:calc(var(--nav-h)+16px);left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:4px solid var(--bg);box-shadow:0 4px 16px rgba(13,148,136,.4);display:flex;align-items:center;justify-content:center;z-index:150;transition:transform .15s}
.fab:active{transform:translateX(-50%) scale(.9)}
.fab svg{width:24px;height:24px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:100%;max-width:var(--max-w);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.22,1,.36,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal__title{font-size:17px;font-weight:700;text-align:center;margin-bottom:16px}
.voice-panel{text-align:center;padding:16px 0 8px}
.voice-orb{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;transition:all .3s;cursor:pointer}
.voice-orb--idle{background:var(--bg);border:2px solid var(--border)}
.voice-orb--idle svg{width:36px;height:36px;color:var(--text-mute)}
.voice-orb--recording{background:rgba(220,38,38,.08);border:2px solid var(--danger);animation:ripple 1.5s infinite}
.voice-orb--recording svg{width:36px;height:36px;color:var(--danger)}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(220,38,38,.3)}100%{box-shadow:0 0 0 22px rgba(220,38,38,0)}}
.voice-hint{font-size:13px;color:var(--text-sub)}
.voice-transcript{margin:14px 0;padding:14px;background:var(--bg);border-radius:var(--r-md);font-size:15px;min-height:48px;color:var(--text-mute);text-align:center;transition:color .2s}
.voice-transcript--active{color:var(--text);text-align:left;border:1px solid var(--border)}
.parsed-preview{margin:12px 0;padding:14px;background:var(--primary-light);border-radius:var(--r-md)}
.parsed-preview__title{font-size:12px;color:var(--primary-hover);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.parsed-preview__title svg{width:16px;height:16px}
.parsed-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(13,148,136,.12)}
.parsed-row:last-child{border-bottom:none}
.parsed-row__left{display:flex;align-items:center;gap:8px;font-size:14px}
.parsed-row__amt{font-family:var(--mono);font-size:14px;font-weight:700}
.parsed-row__amt--expense{color:var(--danger)}
.parsed-row__amt--income{color:var(--success)}
.field{margin-bottom:14px}
.field__label{display:block;font-size:12px;color:var(--text-sub);margin-bottom:6px;font-weight:500}
.field__input,.field__select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);font-size:15px;background:var(--bg);outline:none}
.field__input:focus,.field__select:focus{border-color:var(--primary)}
.type-toggle{display:flex;gap:8px}
.type-toggle__btn{flex:1;padding:10px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:2px solid var(--border);color:var(--text-sub)}
.type-toggle__btn--active{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.btn{width:100%;padding:13px;border-radius:var(--r-md);font-size:15px;font-weight:600;transition:opacity .15s}
.btn--primary{background:var(--primary);color:#fff}
.btn--outline{border:2px solid var(--border);color:var(--text);background:transparent}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.tx-list{padding:12px 16px 0}
.tx-date-group{font-size:12px;color:var(--text-sub);margin:14px 0 6px;font-weight:600;display:flex;justify-content:space-between}
.tx-item{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:transform .08s}
.tx-item:active{transform:scale(.985)}
.tx-icon{width:40px;height:40px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-icon svg{width:20px;height:20px}
.tx-body{flex:1;min-width:0}
.tx-note{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--text-sub);margin-top:1px}
.tx-amount{font-family:var(--mono);font-size:16px;font-weight:700;flex-shrink:0}
.tx-amount--expense{color:var(--danger)}
.tx-amount--income{color:var(--success)}
.tx-delete{color:var(--danger);font-size:12px;padding:6px 8px;flex-shrink:0}
.empty{text-align:center;padding:64px 20px;color:var(--text-mute)}
.empty svg{width:48px;height:48px;margin:0 auto 12px}
.empty p{font-size:14px}
.empty__hint{font-size:12px;margin-top:8px}
.month-selector{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 8px;scrollbar-width:none}
.month-selector::-webkit-scrollbar{display:none}
.month-chip{padding:6px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:13px;white-space:nowrap;flex-shrink:0;color:var(--text-sub)}
.month-chip--active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chart-card{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin:0 16px 12px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.chart-card__title{font-size:13px;color:var(--text-sub);margin-bottom:12px;display:flex;align-items:center;gap:6px;font-weight:600}
.chart-card__title svg{width:16px;height:16px}
.chart-svg{width:100%}
.cat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.cat-row:last-child{border-bottom:none}
.cat-row__left{display:flex;align-items:center;gap:8px;font-size:14px}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-row__amt{font-family:var(--mono);font-weight:600}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:rgba(28,25,23,.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:500;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.hint-box{margin-top:14px;padding:12px;background:var(--bg);border-radius:var(--r-md);font-size:12px;color:var(--text-sub);line-height:1.8}
.voice-big-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-size:16px;font-weight:700;border-radius:var(--r-md);box-shadow:0 2px 8px rgba(13,148,136,.3)}
.voice-big-btn svg{width:22px;height:22px}
.voice-status{padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin:10px 0;display:none}
.voice-status--show{display:block}
.voice-status--error{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
.voice-status--ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#166534}
.voice-status--warn{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E}
.text-input-area{margin:10px 0}
.text-input-area textarea{width:100%;min-height:80px;padding:12px 14px;border:2px solid var(--border);border-radius:var(--r-md);font-size:16px;line-height:1.6;background:var(--bg);outline:none;resize:none;font-family:var(--font)}
.text-input-area textarea:focus{border-color:var(--primary)}
.text-input-area textarea::placeholder{color:var(--text-mute)}
@media(min-width:481px){.app{box-shadow:0 0 0 1px var(--border)}}
</style>
</head>

var state={tab:'record',txs:[],isRecording:false,voiceModal:false,transcript:'',parsedRecords:[],manualModal:false,selectedMonth:new Date().toISOString().slice(0,7),toast:'',form:{type:'expense',amount:'',category:'餐饮',note:''},voiceStatus:'',voiceStatusType:''};

var recognition=null,wantRecording=false,finalTranscript='',restartTimer=null,noResultTimer=null;

function getSpeechSupport(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return{supported:false,reason:'不支持'};
  return{supported:true,reason:window.isSecureContext?'安全环境':'非安全环境'};
}

function createRecognition(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  var r=new SR();
  r.lang='zh-CN';
  r.continuous=false;
  r.interimResults=true;
  r.maxAlternatives=1;
  return r;
}

function startVoice(){
  var sp=getSpeechSupport();
  if(!sp.supported){
    state.voiceStatus='当前浏览器不支持语音识别。请用下方输入框打字，或用Chrome浏览器打开。';
    state.voiceStatusType='error';
    render();
    setTimeout(function(){
      var ta=document.getElementById('text-input');
      if(ta)ta.focus();

    return;
  }

  finalTranscript='';
  wantRecording=true;
  state.isRecording=true;
  state.transcript='';
  state.parsedRecords=[];
  state.voiceStatus='';
  state.voiceStatusType='';

      if(wantRecording&&!finalTranscript){
        state.voiceStatus='未检测到语音。请确认麦克风已开启，或用下方输入框打字';

  };

  recognition.onresult=function(e){
    var interim='';
    for(var i=0;i<e.results.length;i++){
      if(e.results[i].isFinal){

      }else{
        interim+=e.results[i][0].transcript;
      }

    state.isRecording=false;

function stopVoice(){

    for(var i=0;i<res.transactions.length;i++){
      var r=res.transactions[i];
      var meta=CATEGORY_META[r.category]||CATEGORY_META['其他'];
      var cls=r.type==='income'?'parsed-row__amt--income':'parsed-row__amt--expense';
      html+='<div class="parsed-row"><div class="parsed-row__left">'+icon(meta.icon,18)+' '+r.category+' · '+r.note+'</div><div class="parsed-row__amt '+cls+'">'+(r.type==='income'?'+':'-')+'¥'+r.amount.toFixed(2)+'</div></div>';
    }
    var tEl=modal.querySelector('.voice-transcript');
    if(container)container.innerHTML=html;
    else if(tEl){container=document.createElement('div');container.className='parsed-preview';container.innerHTML=html;tEl.after(container)}
    if(btnConfirm)btnConfirm.removeAttribute('disabled');
  });
}

function confirmParsed(){
  if(!state.parsedRecords.length)return;
  var now=new Date(),date=now.toISOString().slice(0,10),time=now.toTimeString().slice(0,5);
  var ps=[];
  for(var i=0;i<state.parsedRecords.length;i++){
    var r=state.parsedRecords[i];
    ps.push(saveTransaction({type:r.type,amount:r.amount,category:r.category,note:r.note,date:date,time:time,timestamp:now.getTime()}));
  }
  Promise.all(ps).then(function(){
    state.txs=JSON.parse(localStorage.getItem('aiBillTxs')||'[]');
    stopVoice();
    state.voiceModal=false;
    showToast('成功记录 '+state.parsedRecords.length+' 笔账目');
  });
}

function openManualModal(){state.manualModal=true;state.form={type:'expense',amount:'',category:'餐饮',note:''};render()}
function closeManualModal(){state.manualModal=false;render()}
function saveManual(){
  var amt=parseFloat(state.form.amount);
  if(!amt||amt<=0){showToast('请输入有效金额');return}
  var now=new Date();
  saveTransaction({type:state.form.type,amount:Math.round(amt*100)/100,category:state.form.category,note:state.form.note||state.form.category,date:now.toISOString().slice(0,10),time:now.toTimeString().slice(0,5),timestamp:now.getTime()}).then(function(){
    state.txs=JSON.parse(localStorage.getItem('aiBillTxs')||'[]');
    state.manualModal=false;state.form={type:'expense',amount:'',category:'餐饮',note:''};
    render();showToast('记账成功');
  });
}
function deleteTx(id){deleteTransaction(id).then(function(){state.txs=JSON.parse(localStorage.getItem('aiBillTxs')||'[]');render();showToast('已删除')})}
function switchTab(tab){state.tab=tab;render()}
function $(sel){return document.querySelector(sel)}
function todayStr(){var d=new Date(),wk=['日','一','二','三','四','五','六'];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk[d.getDay()]}
function monthLabel(ym){var p=ym.split('-');return p[0]+'年'+parseInt(p[1])+'月'}
function showToast(msg){state.toast=msg;render();setTimeout(function(){state.toast='';render()},2000)}

function getMonthExpense(){var ym=new Date().toISOString().slice(0,7),s=0;for(var i=0;i<state.txs.length;i++)if(state.txs[i].type==='expense'&&state.txs[i].date.startsWith(ym))s+=state.txs[i].amount;return s}
function getMonthIncome(){var ym=new Date().toISOString().slice(0,7),s=0;for(var i=0;i<state.txs.length;i++)if(state.txs[i].type==='income'&&state.txs[i].date.startsWith(ym))s+=state.txs[i].amount;return s}
function getMonthCount(){var ym=new Date().toISOString().slice(0,7),c=0;for(var i=0;i<state.txs.length;i++)if(state.txs[i].date.startsWith(ym))c++;return c}
function getGroupedTxs(){var g={};for(var i=0;i<state.txs.length;i++){var t=state.txs[i];if(!g[t.date])g[t.date]={date:t.date,items:[],expense:0};g[t.date].items.push(t);if(t.type==='expense')g[t.date].expense+=t.amount}return Object.keys(g).sort(function(a,b){return b.localeCompare(a)}).map(function(k){var o=g[k],p=o.date.split('-'),wk=['日','一','二','三','四','五','六'];o.dateStr=parseInt(p[1])+'月'+parseInt(p[2])+'日 星期'+wk[new Date(o.date).getDay()];return o})}
function getMonthOptions(){var m={};m[new Date().toISOString().slice(0,7)]=true;for(var i=0;i<state.txs.length;i++)m[state.txs[i].date.slice(0,7)]=true;return Object.keys(m).sort(function(a,b){return b.localeCompare(a)}).map(function(ym){return{value:ym,label:monthLabel(ym)}})}
function getStatsData(){var f=state.txs.filter(function(t){return t.date.startsWith(state.selectedMonth)});var cm={},dm={},te=0;for(var i=0;i<f.length;i++){var t=f[i];if(t.type==='expense'){cm[t.category]=(cm[t.category]||0)+t.amount;te+=t.amount;dm[t.date]=(dm[t.date]||0)+t.amount}}var cl=Object.keys(cm).map(function(n){return{name:n,amount:cm[n]}}).sort(function(a,b){return b.amount-a.amount});var dd=Object.keys(dm).sort().map(function(d){return{date:d,amount:dm[d]}});return{catList:cl,dailyData:dd,totalExpense:te}}

function renderDonut(cl,t){
  if(!cl.length)return'<p style="text-align:center;color:var(--text-mute);padding:40px 0">暂无支出数据</p>';
  var cx=120,cy=120,r=72,rIn=44,ang=-Math.PI/2,paths='',leg=[];
  for(var i=0;i<cl.length;i++){var c=cl[i],pct=c.amount/t,sA=ang,eA=ang+pct*2*Math.PI,lg=pct>0.5?1:0;var x1=cx+r*Math.cos(sA),y1=cy+r*Math.sin(sA),x2=cx+r*Math.cos(eA),y2=cy+r*Math.sin(eA),x3=cx+rIn*Math.cos(eA),y3=cy+rIn*Math.sin(eA),x4=cx+rIn*Math.cos(sA),y4=cy+rIn*Math.sin(sA);var meta=CATEGORY_META[c.name]||CATEGORY_META['其他'];paths+='<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 '+lg+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' L'+x3.toFixed(1)+' '+y3.toFixed(1)+' A'+rIn+' '+rIn+' 0 '+lg+' 0 '+x4.toFixed(1)+' '+y4.toFixed(1)+' Z" fill="'+meta.color+'"/>';leg.push({name:c.name,pct:(pct*100).toFixed(1),color:meta.color});ang=eA}
  var lbl='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="11" fill="#78716C">总支出</text><text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="20" font-weight="700" fill="#1C1917">¥'+t.toFixed(0)+'</text>';
  var lh='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">';
  for(var j=0;j<leg.length;j++){var l=leg[j];lh+='<span style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-sub)"><span style="width:8px;height:8px;border-radius:50%;background:'+l.color+'"></span>'+l.name+' '+l.pct+'%</span>'}
  return'<svg class="chart-svg" viewBox="0 0 240 240">'+paths+lbl+'</svg>'+lh+'</div>';
}
function renderLineChart(dd){
  if(dd.length<2)return'<p style="text-align:center;color:var(--text-mute);padding:40px 0">数据不足</p>';
  var W=300,H=180,pad={t:16,r:16,b:32,l:36},xMax=dd.length-1,yMax=Math.max.apply(null,dd.map(function(d){return d.amount}))*1.15,pW=W-pad.l-pad.r,pH=H-pad.t-pad.b;
  function xs(i){return pad.l+(i/xMax)*pW}function ys(v){return pad.t+pH-(v/yMax)*pH}
  var grid='';for(var g=0;g<=4;g++){var y=pad.t+(g/4)*pH;grid+='<line x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+y.toFixed(1)+'" stroke="#E7E5E0" stroke-width="0.5" stroke-dasharray="2,2"/>'}
  var pts=dd.map(function(d,i){return xs(i).toFixed(1)+','+ys(d.amount).toFixed(1)}).join(' ');
  var area=pad.l+','+(pad.t+pH).toFixed(1)+' '+pts+' '+(W-pad.r).toFixed(1)+','+(pad.t+pH).toFixed(1);
  var xl='',step=Math.ceil(dd.length/6);for(var i=0;i<dd.length;i++){if(i%step===0||i===dd.length-1)xl+='<text x="'+xs(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="#A8A29E">'+dd[i].date.slice(5)+'</text>'}
  var yl='';for(var g2=0;g2<=4;g2++){var v=yMax*(1-g2/4);yl+='<text x="'+(pad.l-4)+'" y="'+(pad.t+(g2/4)*pH+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#A8A29E">'+v.toFixed(0)+'</text>'}
  var dots='';for(var d=0;d<dd.length;d++)dots+='<circle cx="'+xs(d).toFixed(1)+'" cy="'+ys(dd[d].amount).toFixed(1)+'" r="3" fill="#0D9488"/>';
  return'<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'">'+grid+yl+'<polygon points="'+area+'" fill="rgba(13,148,136,.12)"/><polyline points="'+pts+'" fill="none" stroke="#0D9488" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots+xl+'</svg>';
}

function render(){
  var app=$('#app'),html='';
  // Top bar
  html+='<div class="top-bar"><div class="top-bar__row"><div><div class="top-bar__title">'+icon('wallet',22)+' 记账小管家</div><div class="top-bar__date">'+todayStr()+'</div></div><button class="top-bar__add" onclick="openManualModal()">'+icon('plus',20)+'</button></div></div>';
  if(state.tab==='record'){
    var exp=getMonthExpense(),inc=getMonthIncome(),cnt=getMonthCount();
    html+='<div class="summary-card reveal"><div class="summary-item"><div class="summary-item__num summary-item__num--expense">¥'+exp.toFixed(2)+'</div><div class="summary-item__label">本月支出</div></div><div class="summary-item"><div class="summary-item__num summary-item__num--neutral">'+cnt+'</div><div class="summary-item__label">本月笔数</div></div><div class="summary-item"><div class="summary-item__num summary-item__num--income">¥'+inc.toFixed(2)+'</div><div class="summary-item__label">本月收入</div></div></div>';
    html+='<div style="padding:12px 16px 4px"><button class="btn btn--primary voice-big-btn" onclick="openVoiceModal()">'+icon('plus',20)+' 记账</button></div>';
    var groups=getGroupedTxs();
    html+='<div class="tx-list">';
    if(groups.length){var d=0;
      for(var gi=0;gi<groups.length;gi++){var g=groups[gi];d+=0.05;
        html+='<div class="tx-date-group reveal" style="animation-delay:'+d+'s"><span>'+g.dateStr+'</span><span>支出 ¥'+g.expense.toFixed(2)+'</span></div>';
        for(var ti=0;ti<g.items.length;ti++){var tx=g.items[ti],meta=CATEGORY_META[tx.category]||CATEGORY_META['其他'],sign=tx.type==='expense'?'-':'+',cls=tx.type==='expense'?'tx-amount--expense':'tx-amount--income';
          html+='<div class="tx-item reveal" style="animation-delay:'+d+'s"><div class="tx-icon" style="background:'+meta.bg+';color:'+meta.color+'">'+icon(meta.icon,20)+'</div><div class="tx-body"><div class="tx-note">'+tx.note+'</div><div class="tx-meta">'+tx.category+' · '+tx.time+'</div></div><div class="tx-amount '+cls+'">'+sign+'¥'+tx.amount.toFixed(2)+'</div><button class="tx-delete" onclick="deleteTx('+tx.id+')">删除</button></div>';
        }
      }
    }else{
      html+='<div class="empty">'+icon('inbox',48)+'<p>还没有记账记录</p><p class="empty__hint">点击上方"记账"按钮开始记账</p></div>';
    }
    html+='</div>';
  }
  if(state.tab==='stats'){
    var months=getMonthOptions(),stats=getStatsData();
    html+='<div class="month-selector">';
    for(var mi=0;mi<months.length;mi++){var m=months[mi];html+='<div class="month-chip '+(m.value===state.selectedMonth?'month-chip--active':'')+'" onclick="state.selectedMonth=\''+m.value+'\';render()">'+m.label+'</div>'}
    html+='</div>';
    if(stats.totalExpense>0){
      html+='<div class="chart-card reveal"><div class="chart-card__title">'+icon('pie-chart',16)+' 支出分类占比</div>'+renderDonut(stats.catList,stats.totalExpense)+'</div>';
      if(stats.dailyData.length>1)html+='<div class="chart-card reveal" style="animation-delay:.1s"><div class="chart-card__title">'+icon('line-chart',16)+' 每日支出趋势</div>'+renderLineChart(stats.dailyData)+'</div>';
      html+='<div class="chart-card reveal" style="animation-delay:.15s"><div class="chart-card__title">'+icon('bar-chart-3',16)+' 分类明细</div>';
      for(var ci=0;ci<stats.catList.length;ci++){var c=stats.catList[ci],meta2=CATEGORY_META[c.name]||CATEGORY_META['其他'],pct=(c.amount/stats.totalExpense*100).toFixed(1);html+='<div class="cat-row"><div class="cat-row__left"><span class="cat-dot" style="background:'+meta2.color+'"></span>'+c.name+' <span style="font-size:11px;color:var(--text-mute)">('+pct+'%)</span></div><span class="cat-row__amt">¥'+c.amount.toFixed(2)+'</span></div>'}
      html+='</div>';
    }else{
      html+='<div class="empty">'+icon('bar-chart-3',48)+'<p>本月暂无数据</p></div>';
    }
  }
  html+='<div class="fab" onclick="openVoiceModal()">'+icon('plus',24)+'</div>';
  html+='<div class="tab-bar"><div class="tab-item '+(state.tab==='record'?'active':'')+'" onclick="switchTab(\'record\')">'+icon('receipt',22)+'<span>记账</span></div><div class="tab-item '+(state.tab==='stats'?'active':'')+'" onclick="switchTab(\'stats\')">'+icon('bar-chart-3',22)+'<span>统计</span></div></div>';

  // Voice modal
  if(state.voiceModal){
    var parsedHTML='';
    if(state.parsedRecords.length){
      parsedHTML='<div class="parsed-preview"><div class="parsed-preview__title">'+icon('sparkles',16)+' AI解析结果（共'+state.parsedRecords.length+'笔）</div>';
      for(var pi=0;pi<state.parsedRecords.length;pi++){var r=state.parsedRecords[pi],meta3=CATEGORY_META[r.category]||CATEGORY_META['其他'],aCls=r.type==='income'?'parsed-row__amt--income':'parsed-row__amt--expense';parsedHTML+='<div class="parsed-row"><div class="parsed-row__left">'+icon(meta3.icon,18)+' '+r.category+' · '+r.note+'</div><div class="parsed-row__amt '+aCls+'">'+(r.type==='income'?'+':'-')+'¥'+r.amount.toFixed(2)+'</div></div>'}
      parsedHTML+='</div>';
    }
    var overlayClick='onclick="if(event.target===this)closeVoiceModal()"';
    // Primary: large auto-focus text input with keyboard mic guide
    var inputHTML='<div class="text-input-area"><textarea id="text-input" style="min-height:120px;font-size:18px;line-height:1.8" placeholder="输入记账内容...&#10;&#10;例如：午饭花了二十块，打车回家三十五" oninput="textInputChange(this.value)" onclick="event.stopPropagation()">'+(state.transcript||'')+'</textarea></div>';
    var guideHTML='<div class="hint-box">'+icon('sparkles',16)+' 支持中文口语数字（两百、一百二、九块九）<br>支持一句话记多笔账，AI自动分类<br>支持识别收入："收到工资三千"</div>';
    html+='<div class="modal-overlay" '+overlayClick+'><div class="modal"><div class="modal__title">记账</div>'+inputHTML+parsedHTML+'<div class="btn-row"><button class="btn btn--outline" onclick="event.stopPropagation();closeVoiceModal()">取消</button><button class="btn btn--primary" onclick="event.stopPropagation();confirmParsed()" '+(state.parsedRecords.length?'':'disabled')+'>确认记账</button></div>'+guideHTML+'</div></div>';
  }

  // Manual modal
  if(state.manualModal){
    var catOpts='';
    for(var ci2=0;ci2<CATEGORIES.length;ci2++)catOpts+='<option value="'+CATEGORIES[ci2]+'"'+(state.form.category===CATEGORIES[ci2]?' selected':'')+'>'+CATEGORIES[ci2]+'</option>';
    html+='<div class="modal-overlay" onclick="if(event.target===this)closeManualModal()"><div class="modal"><div class="modal__title">手动记账</div><div class="field"><label class="field__label">类型</label><div class="type-toggle"><button class="type-toggle__btn '+(state.form.type==='expense'?'type-toggle__btn--active':'')+'" onclick="state.form.type=\'expense\';render()">支出</button><button class="type-toggle__btn '+(state.form.type==='income'?'type-toggle__btn--active':'')+'" onclick="state.form.type=\'income\';render()">收入</button></div></div><div class="field"><label class="field__label">金额</label><input class="field__input" type="number" step="0.01" placeholder="0.00" value="'+state.form.amount+'" oninput="state.form.amount=this.value"></div><div class="field"><label class="field__label">分类</label><select class="field__select" onchange="state.form.category=this.value">'+catOpts+'</select></div><div class="field"><label class="field__label">备注</label><input class="field__input" type="text" placeholder="如：午饭、打车" value="'+state.form.note+'" oninput="state.form.note=this.value"></div><div class="btn-row"><button class="btn btn--outline" onclick="closeManualModal()">取消</button><button class="btn btn--primary" onclick="saveManual()">保存</button></div></div></div>';
  }
  if(state.toast)html+='<div class="toast">'+state.toast+'</div>';
  app.innerHTML=html;
}

function init(){
  var VER='v7_clean';
  if(localStorage.getItem('aiBillVer')!==VER){
    localStorage.removeItem('aiBillTxs');
    localStorage.setItem('aiBillVer',VER);
  }
  state.txs=JSON.parse(localStorage.getItem('aiBillTxs')||'[]');
  render();
}

window.state=state;window.icon=icon;window.render=render;window.switchTab=switchTab;
window.openVoiceModal=openVoiceModal;window.closeVoiceModal=closeVoiceModal;
window.startVoice=startVoice;window.stopVoice=stopVoice;
window.confirmParsed=confirmParsed;window.openManualModal=openManualModal;window.closeManualModal=closeManualModal;
window.saveManual=saveManual;window.deleteTx=deleteTx;window.textInputChange=textInputChange;
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
