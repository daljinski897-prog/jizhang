<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>记账小管家</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%230D9488'/></svg>">
<style>
:root{--primary:#0D9488;--primary-hover:#0F766E;--primary-light:#CCFBF1;--bg:#FAFAF7;--surface:#FFFFFF;--border:#E7E5E0;--text:#1C1917;--text-sub:#78716C;--text-mute:#A8A29E;--success:#16A34A;--danger:#DC2626;--r-sm:6px;--r-md:10px;--r-lg:16px;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--max-w:480px;--nav-h:56px;--font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--mono:"SF Mono","JetBrains Mono",monospace}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;max-width:var(--max-w);margin:0 auto;min-height:100vh;font-size:14px;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit}
svg{display:block}
.app{background:radial-gradient(ellipse at 20% -5%,rgba(13,148,136,.05) 0%,transparent 55%),radial-gradient(ellipse at 85% 8%,rgba(245,158,11,.04) 0%,transparent 45%),var(--bg);min-height:100vh;padding-bottom:calc(var(--nav-h)+72px);position:relative}
.top-bar{position:sticky;top:0;z-index:100;background:rgba(250,250,247,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 20px 10px}
.top-bar__row{display:flex;align-items:center;justify-content:space-between}
.top-bar__title{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px;letter-spacing:-0.02em}
.top-bar__title svg{width:22px;height:22px;color:var(--primary)}
.top-bar__date{font-size:12px;color:var(--text-sub);margin-top:2px}
.top-bar__add{width:36px;height:36px;border-radius:var(--r-md);background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top-bar__btns{display:flex;align-items:center;gap:8px;flex-shrink:0}
.top-bar__btn{height:34px;padding:0 10px;border-radius:var(--r-md);display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;background:var(--primary-light);color:var(--primary);white-space:nowrap}
.top-bar__btn svg{width:17px;height:17px}
.top-bar__btn--cfg{background:#FEF3C7;color:#B45309}
.top-bar__btn:active{transform:scale(.94)}
.backup-note{font-size:12px;color:var(--text-sub);line-height:1.6}
.backup-note b{color:var(--text-main)}
.import-status{margin-top:8px;font-size:13px;font-weight:600}
.import-status--ok{color:var(--success)}
.import-status--err{color:#DC2626}
.config-filepick{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--border,#D6D3D1);border-radius:var(--r-md);background:#FAFAF9;color:var(--primary);font-size:14px;font-weight:700;cursor:pointer;text-align:center}
.config-filepick svg{width:18px;height:18px}
.config-filepick:active{background:var(--primary-light,#E6F4F1)}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:1}
#app.app--intro .reveal{animation:reveal .35s ease-out both}
.summary-card{background:var(--surface);margin:12px 16px 0;border-radius:var(--r-lg);padding:18px 8px;box-shadow:var(--shadow-sm);border:1px solid var(--border);display:flex}
.summary-item{flex:1;text-align:center;position:relative}
.summary-item+.summary-item::before{content:'';position:absolute;left:0;top:15%;bottom:15%;width:1px;background:var(--border)}
.summary-item__num{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-0.03em}
.summary-item__num--expense{color:var(--danger)}
.summary-item__num--income{color:var(--success)}
.summary-item__num--neutral{color:var(--text)}
.summary-item__label{font-size:11px;color:var(--text-sub);margin-top:4px}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max-w);height:var(--nav-h);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:200}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-mute);font-size:11px;transition:color .2s}
.tab-item svg{width:22px;height:22px;stroke-width:1.75}
.tab-item.active{color:var(--primary)}
.tab-item.active svg{stroke-width:2}
.fab{position:fixed;bottom:calc(var(--nav-h)+16px);left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:4px solid var(--bg);box-shadow:0 4px 16px rgba(13,148,136,.4);display:flex;align-items:center;justify-content:center;z-index:150;transition:transform .15s}
.fab:active{transform:translateX(-50%) scale(.9)}
.fab svg{width:24px;height:24px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);width:100%;max-width:var(--max-w);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.22,1,.36,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal__title{font-size:17px;font-weight:700;text-align:center;margin-bottom:16px}
.voice-panel{text-align:center;padding:16px 0 8px}
.voice-orb{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;transition:all .3s;cursor:pointer}
.voice-orb--idle{background:var(--bg);border:2px solid var(--border)}
.voice-orb--idle svg{width:36px;height:36px;color:var(--text-mute)}
.voice-orb--recording{background:rgba(220,38,38,.08);border:2px solid var(--danger);animation:ripple 1.5s infinite}
.voice-orb--recording svg{width:36px;height:36px;color:var(--danger)}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(220,38,38,.3)}100%{box-shadow:0 0 0 22px rgba(220,38,38,0)}}
.voice-hint{font-size:13px;color:var(--text-sub)}
.voice-transcript{margin:14px 0;padding:14px;background:var(--bg);border-radius:var(--r-md);font-size:15px;min-height:48px;color:var(--text-mute);text-align:center;transition:color .2s}
.voice-transcript--active{color:var(--text);text-align:left;border:1px solid var(--border)}
.parsed-preview{margin:12px 0;padding:14px;background:var(--primary-light);border-radius:var(--r-md)}
.parsed-preview__title{font-size:12px;color:var(--primary-hover);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.parsed-preview__title svg{width:16px;height:16px}
.parsed-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(13,148,136,.12)}
.parsed-row:last-child{border-bottom:none}
.parsed-row__left{display:flex;align-items:center;gap:8px;font-size:14px}
.parsed-row__amt{font-family:var(--mono);font-size:14px;font-weight:700}
.parsed-row__amt--expense{color:var(--danger)}
.parsed-row__amt--income{color:var(--success)}
.field{margin-bottom:14px}
.field__label{display:block;font-size:12px;color:var(--text-sub);margin-bottom:6px;font-weight:500}
.field__input,.field__select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);font-size:15px;background:var(--bg);outline:none}
.field__input:focus,.field__select:focus{border-color:var(--primary)}
.type-toggle{display:flex;gap:8px}
.type-toggle__btn{flex:1;padding:10px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:2px solid var(--border);color:var(--text-sub)}
.type-toggle__btn--active{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.btn{width:100%;padding:13px;border-radius:var(--r-md);font-size:15px;font-weight:600;transition:opacity .15s}
.btn--primary{background:var(--primary);color:#fff}
.btn--outline{border:2px solid var(--border);color:var(--text);background:transparent}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
.tx-list{padding:12px 16px 0}
.page-record{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.page-record .top-bar{position:static;flex-shrink:0}
.page-record .summary-card{flex-shrink:0}
.record-entry{flex-shrink:0}
.tx-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + 84px)}
.stats-spacer{height:calc(var(--nav-h) + 84px);flex-shrink:0}
.tx-date-group{font-size:12px;color:var(--text-sub);margin:14px 0 6px;font-weight:600;display:flex;justify-content:space-between}
.tx-item{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:transform .08s}
.tx-item:active{transform:scale(.985)}
.tx-icon{width:40px;height:40px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-icon svg{width:20px;height:20px}
.tx-body{flex:1;min-width:0}
.tx-note{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--text-sub);margin-top:1px}
.tx-amount{font-family:var(--mono);font-size:16px;font-weight:700;flex-shrink:0}
.tx-amount--expense{color:var(--danger)}
.tx-amount--income{color:var(--success)}
.tx-delete{color:var(--danger);font-size:12px;padding:6px 8px;flex-shrink:0}
.empty{text-align:center;padding:64px 20px;color:var(--text-mute)}
.empty svg{width:48px;height:48px;margin:0 auto 12px}
.empty p{font-size:14px}
.empty__hint{font-size:12px;margin-top:8px}
.dim-toggle{display:flex;gap:6px;padding:12px 16px 0}
.dim-toggle__btn{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:14px;color:var(--text-sub);font-weight:600}
.dim-toggle__btn--active{background:var(--primary);color:#fff;border-color:var(--primary)}
.period-picker-wrap{padding:10px 16px 4px}
.period-picker{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:16px;color:var(--text-primary);box-sizing:border-box}
.period-picker:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.month-selector{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 8px;scrollbar-width:none}
.month-selector::-webkit-scrollbar{display:none}
.month-chip{padding:6px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:13px;white-space:nowrap;flex-shrink:0;color:var(--text-sub)}
.month-chip--active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chart-card{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin:0 16px 12px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.chart-card__title{font-size:13px;color:var(--text-sub);margin-bottom:12px;display:flex;align-items:center;gap:6px;font-weight:600}
.chart-card__title svg{width:16px;height:16px}
.chart-svg{width:100%}
.cat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.cat-row:last-child{border-bottom:none}
.cat-row__left{display:flex;align-items:center;gap:8px;font-size:14px}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-row__amt{font-family:var(--mono);font-weight:600}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:rgba(28,25,23,.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:500;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.hint-box{margin-top:14px;padding:12px;background:var(--bg);border-radius:var(--r-md);font-size:12px;color:var(--text-sub);line-height:1.8}
.voice-big-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-size:16px;font-weight:700;border-radius:var(--r-md);box-shadow:0 2px 8px rgba(13,148,136,.3)}
.voice-big-btn svg{width:22px;height:22px}
.voice-status{padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin:10px 0;display:none}
.voice-status--show{display:block}
.voice-status--error{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
.voice-status--ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#166534}
.voice-status--warn{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E}
.text-input-area{margin:10px 0}
.text-input-area textarea{width:100%;min-height:80px;padding:12px 14px;border:2px solid var(--border);border-radius:var(--r-md);font-size:16px;line-height:1.6;background:var(--bg);outline:none;resize:none;font-family:var(--font)}
.text-input-area textarea:focus{border-color:var(--primary)}
.text-input-area textarea::placeholder{color:var(--text-mute)}
@media(min-width:481px){.app{box-shadow:0 0 0 1px var(--border)}}
.mapping-list{margin:8px 0 12px}
.mapping-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:6px;background:var(--bg)}
.mapping-item__left{display:flex;align-items:center;gap:8px;font-size:14px;flex:1;min-width:0}
.mapping-item__kw{font-weight:600;color:var(--text)}
.mapping-item__arrow{color:var(--text-mute);font-size:12px}
.mapping-item__cat{font-size:13px;color:var(--primary);font-weight:600}
.mapping-item__type{font-size:11px;padding:2px 6px;border-radius:4px;margin-left:4px}
.mapping-item__type--expense{background:#FEF2F2;color:#DC2626}
.mapping-item__type--income{background:#F0FDF4;color:#16A34A}
.mapping-empty{text-align:center;padding:20px;color:var(--text-mute);font-size:13px}
</style>
</head>

var CN_NUM={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'百':100,'千':1000,'万':10000};
function parseCnNum(s){
  if(/^\d+(\.\d+)?$/.test(s))return parseFloat(s);
  if(!s)return null;
  var chars=s.split('');
  for(var i=0;i<chars.length;i++)if(!(chars[i] in CN_NUM))return null;
  var result=0,section=0,num=0;
  for(var i=0;i<chars.length;i++){
    var v=CN_NUM[chars[i]];
    if(v<10){num=v}
    else if(v===10){section+=(num||1)*10;num=0}
    else if(v===100){section+=(num||1)*100;num=0}
    else if(v===1000){section+=(num||1)*1000;num=0}
    else if(v===10000){result+=(section+num)*10000;section=0;num=0}
  }
  var val=result+section+num;
  return val>0?val:null;
}

function importBackup(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      var imported=Array.isArray(data)?data:(data&&data.app==='aiBill'&&Array.isArray(data.txs)?data.txs:null);
      if(!imported)throw new Error('不是有效的记账备份文件');
      imported=imported.filter(function(t){return t&&typeof t.amount==='number'&&t.category&&t.date});
      var current=JSON.parse(localStorage.getItem('aiBillTxs')||'[]');
      var seen={},merged=[];
      current.forEach(function(t){if(t.id!==undefined)seen[t.id]=1;merged.push(t)});
      var added=0;
      imported.forEach(function(t){
        if(t.id!==undefined){if(seen[t.id])return;seen[t.id]=1}
        if(t.id===undefined)t.id=Date.now()+Math.random()+added;
        merged.push(t);added++;
      });
      merged.sort(function(a,b){return(b.timestamp||0)-(a.timestamp||0)});
      localStorage.setItem('aiBillTxs',JSON.stringify(merged));
      state.txs=merged;
      if(data&&data.app==='aiBill'&&Array.isArray(data.mappings)){
        var curMaps=JSON.parse(localStorage.getItem('aiBillMappings')||'[]');
        var mapSeen={},mapMerged=[];
        curMaps.forEach(function(m){if(m.id!==undefined)mapSeen[m.id]=1;mapMerged.push(m)});
        data.mappings.forEach(function(m){if(m.id!==undefined&&mapSeen[m.id])return;if(m.id===undefined)m.id=Date.now()+Math.random();mapMerged.push(m)});
        localStorage.setItem('aiBillMappings',JSON.stringify(mapMerged));
      }
      state.importStatus={type:'ok',msg:'恢复成功：新增 '+added+' 条，当前共 '+merged.length+' 条记录'};
      render();
      showToast('恢复成功，共 '+merged.length+' 条');
    }catch(err){
      state.importStatus={type:'err',msg:'导入失败：'+err.message};
      render();
    }
  };
  reader.onerror=function(){state.importStatus={type:'err',msg:'读取文件失败，请重试'};render()};
  reader.readAsText(file);
}

  recognition.onresult=function(e){
    var interim='';
    for(var i=0;i<e.results.length;i++){
      if(e.results[i].isFinal){
        finalTranscript+=e.results[i][0].transcript;
      }else{
        interim+=e.results[i][0].transcript;
      }
    }
    state.transcript=finalTranscript+interim;
    var el=document.querySelector('.voice-transcript');
    if(el){
      if(state.transcript){
        el.classList.add('voice-transcript--active');
        el.textContent=state.transcript;
      }
    }
    if(finalTranscript){
      apiParseIncremental(finalTranscript);
    }
    if(noResultTimer){clearTimeout(noResultTimer);noResultTimer=null}
  };

  recognition.onerror=function(e){
    if(e.error==='no-speech')return;
    if(e.error==='aborted')return;
    var msg='';
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      msg='麦克风权限被拒绝。请在浏览器设置中允许麦克风权限，或用下方输入框打字';
    }else if(e.error==='network'){
      msg='网络错误，语音识别需要联网。请检查网络或用下方输入框打字';
    }else if(e.error==='audio-capture'){
      msg='无法访问麦克风，请检查设备';
    }else{
      msg='语音不可用（'+e.error+'），请用下方输入框打字';
    }
    state.voiceStatus=msg;
    state.voiceStatusType='error';
    wantRecording=false;
    state.isRecording=false;
    render();
  };

  recognition.onend=function(){
    if(noResultTimer){clearTimeout(noResultTimer);noResultTimer=null}
    if(wantRecording){
      // Auto-restart to keep listening (simulates continuous mode)
      restartTimer=setTimeout(function(){
        if(wantRecording){
          try{
            recognition.start();
          }catch(err){
            wantRecording=false;
            state.isRecording=false;
            state.voiceStatus='语音中断，请用下方输入框打字';
            state.voiceStatusType='warn';
            render();
          }
        }
      },100);
    }else{
      state.isRecording=false;
      render();
    }
  };

  try{
    recognition.start();
  }catch(e){
    state.voiceStatus='语音启动失败，请用下方输入框打字';
    state.voiceStatusType='error';
    wantRecording=false;
    state.isRecording=false;
    render();
    setTimeout(function(){
      var ta=document.getElementById('text-input');
      if(ta)ta.focus();
    },300);
  }
}

function stopVoice(){
  wantRecording=false;
  if(restartTimer){clearTimeout(restartTimer);restartTimer=null}
  if(noResultTimer){clearTimeout(noResultTimer);noResultTimer=null}
  if(recognition){try{recognition.stop()}catch(e){}}
  state.isRecording=false;
  render();
}

function handleEnterKey(e){
  if(e.key!=='Enter'||e.isComposing||e.ctrlKey||e.shiftKey||e.altKey||e.metaKey)return;
  e.preventDefault();
  var ta=document.getElementById('text-input'),val=ta?ta.value:state.transcript;
  if(!val||!val.trim()){showToast('请输入内容');return}
  parseVoiceToTransactions(val,state.entryMode).then(function(res){
    state.parsedRecords=res.transactions;
    if(res.transactions.length){confirmParsed()}
    else{showToast('未识别到金额，请检查输入')}
  });
}

function apiParseIncremental(text){
  parseVoiceToTransactions(text,state.entryMode).then(function(res){
    state.parsedRecords=res.transactions;
    var modal=document.querySelector('.modal');
    if(!modal)return;
    var container=modal.querySelector('.parsed-preview');
    var btnConfirm=modal.querySelector('.btn--primary');
    if(!res.transactions.length){
      if(container)container.remove();
      if(btnConfirm)btnConfirm.setAttribute('disabled','');
      return;
    }
    var html='<div class="parsed-preview__title">'+icon('sparkles',16)+' AI解析结果（共'+res.transactions.length+'笔）</div>';
    for(var i=0;i<res.transactions.length;i++){
      var r=res.transactions[i];
      var meta=CATEGORY_META[r.category]||CATEGORY_META['其他'];
      var cls=r.type==='income'?'parsed-row__amt--income':'parsed-row__amt--expense';
      html+='<div class="parsed-row"><div class="parsed-row__left">'+icon(meta.icon,18)+' '+r.category+' · '+r.note+'</div><div class="parsed-row__amt '+cls+'">'+(r.type==='income'?'+':'-')+'¥'+r.amount.toFixed(2)+'</div></div>';
    }
    var tEl=modal.querySelector('.voice-transcript');
    if(container)container.innerHTML=html;
    else if(tEl){container=document.createElement('div');container.className='parsed-preview';container.innerHTML=html;tEl.after(container)}
    if(btnConfirm)btnConfirm.removeAttribute('disabled');
  });
}

function confirmParsed(){
  if(!state.parsedRecords.length)return;
  var now=new Date(),date=now.toISOString().slice(0,10),time=now.toTimeString().slice(0,5);
  var ps=[];
  for(var i=0;i<state.parsedRecords.length;i++){
    var r=state.parsedRecords[i];
    ps.push(saveTransaction({type:r.type,amount:r.amount,category:r.category,note:r.note,date:date,time:time,timestamp:now.getTime()}));
  }
  Promise.all(ps).then(function(){
    state.txs=JSON.parse(localStorage.getItem('aiBillTxs')||'[]');
    stopVoice();
    state.voiceModal=false;
    showToast('成功记录 '+state.parsedRecords.length+' 笔账目');
  });
}

function $(sel){return document.querySelector(sel)}
function todayStr(){var d=new Date(),wk=['日','一','二','三','四','五','六'];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk[d.getDay()]}
function monthLabel(ym){var p=ym.split('-');return p[0]+'年'+parseInt(p[1])+'月'}
function showToast(msg){state.toast=msg;render();setTimeout(function(){state.toast='';var el=document.querySelector('.toast');if(el)el.remove();else render()},2000)}

function getMonthExpense(){var ym=new Date().toISOString().slice(0,7),s=0;for(var i=0;i<state.txs.length;i++)if(state.txs[i].type==='expense'&&state.txs[i].date.startsWith(ym))s+=state.txs[i].amount;return s}
function getMonthIncome(){var ym=new Date().toISOString().slice(0,7),s=0;for(var i=0;i<state.txs.length;i++)if(state.txs[i].type==='income'&&state.txs[i].date.startsWith(ym))s+=state.txs[i].amount;return s}
function getMonthCount(){var ym=new Date().toISOString().slice(0,7),c=0;for(var i=0;i<state.txs.length;i++)if(state.txs[i].date.startsWith(ym))c++;return c}
function getGroupedTxs(){var g={};for(var i=0;i<state.txs.length;i++){var t=state.txs[i];if(!g[t.date])g[t.date]={date:t.date,items:[],expense:0,income:0};g[t.date].items.push(t);if(t.type==='expense')g[t.date].expense+=t.amount;else if(t.type==='income')g[t.date].income+=t.amount}return Object.keys(g).sort(function(a,b){return b.localeCompare(a)}).map(function(k){var o=g[k],p=o.date.split('-'),wk=['日','一','二','三','四','五','六'];o.dateStr=parseInt(p[1])+'月'+parseInt(p[2])+'日 星期'+wk[new Date(o.date).getDay()];return o})}
function getMonthOptions(){var m={};m[new Date().toISOString().slice(0,7)]=true;for(var i=0;i<state.txs.length;i++)m[state.txs[i].date.slice(0,7)]=true;return Object.keys(m).sort(function(a,b){return b.localeCompare(a)}).map(function(ym){return{value:ym,label:monthLabel(ym)}})}
function getYearOptions(){var y={};y[new Date().toISOString().slice(0,4)]=true;for(var i=0;i<state.txs.length;i++)y[state.txs[i].date.slice(0,4)]=true;return Object.keys(y).sort(function(a,b){return b.localeCompare(a)}).map(function(yr){return{value:yr,label:yr+'年'}})}
function getDayOptions(period){var d={};for(var i=0;i<state.txs.length;i++){var dt=state.txs[i].date;if(dt.startsWith(period))d[dt]=true}var keys=Object.keys(d).sort(function(a,b){return b.localeCompare(a)});if(!keys.length)keys=[period];return keys.map(function(dt){var p=dt.split('-');return{value:dt,label:parseInt(p[1])+'月'+parseInt(p[2])+'日'}})}
function getStatsData(){
  var dim=state.statDim,period=state.statPeriod;
  var f=state.txs.filter(function(t){return t.date.startsWith(period)});
  // 趋势聚合键：年→按月，月→按日，日→无趋势
  var trendKey=function(date){return dim==='year'?date.slice(0,7):date};
  var cm={},dm={},te=0,im={},idm={},ti=0;
  for(var i=0;i<f.length;i++){
    var t=f[i],k=trendKey(t.date);
    if(t.type==='expense'){cm[t.category]=(cm[t.category]||0)+t.amount;te+=t.amount;dm[k]=(dm[k]||0)+t.amount}
    else if(t.type==='income'){im[t.category]=(im[t.category]||0)+t.amount;ti+=t.amount;idm[k]=(idm[k]||0)+t.amount}
  }
  var cl=Object.keys(cm).map(function(n){return{name:n,amount:cm[n]}}).sort(function(a,b){return b.amount-a.amount});
  var dd=dim==='day'?[]:Object.keys(dm).sort().map(function(d){return{date:d,amount:dm[d]}});
  var icl=Object.keys(im).map(function(n){return{name:n,amount:im[n]}}).sort(function(a,b){return b.amount-a.amount});
  var idd=dim==='day'?[]:Object.keys(idm).sort().map(function(d){return{date:d,amount:idm[d]}});
  return{catList:cl,dailyData:dd,totalExpense:te,incomeCatList:icl,incomeDailyData:idd,totalIncome:ti}
}

function renderLineChart(dd,lineColor,areaColor){

      html+='<div class="chart-card reveal" style="animation-delay:.05s"><div class="chart-card__title">'+icon('pie-chart',16)+' 支出分类占比</div>'+renderDonut(stats.catList,stats.totalExpense,'总支出','#1C1917','expense')+'</div>';
      if(stats.dailyData.length>1)html+='<div class="chart-card reveal" style="animation-delay:.1s"><div class="chart-card__title">'+icon('line-chart',16)+' '+trendTitle+'支出趋势</div>'+renderLineChart(stats.dailyData,'#DC2626','rgba(220,38,38,.12)')+'</div>';
      html+='<div class="chart-card reveal" style="animation-delay:.15s"><div class="chart-card__title">'+icon('bar-chart-3',16)+' 支出分类明细</div>';
      for(var ci=0;ci<stats.catList.length;ci++){var c=stats.catList[ci],meta2=CATEGORY_META[c.name]||CATEGORY_META['其他'],pct=(c.amount/stats.totalExpense*100).toFixed(1);html+='<div class="cat-row"><div class="cat-row__left"><span class="cat-dot" style="background:'+meta2.color+'"></span>'+c.name+' <span style="font-size:11px;color:var(--text-mute)">('+pct+'%)</span></div><span class="cat-row__amt">¥'+c.amount.toFixed(2)+'</span></div>'}
      html+='</div>';
    }
    if(stats.totalIncome>0){
      html+='<div class="chart-card reveal" style="animation-delay:.1s"><div class="chart-card__title">'+icon('pie-chart',16)+' 收入来源占比</div>'+renderDonut(stats.incomeCatList,stats.totalIncome,'总收入','#16A34A','income')+'</div>';
      if(stats.incomeDailyData.length>1)html+='<div class="chart-card reveal" style="animation-delay:.15s"><div class="chart-card__title">'+icon('line-chart',16)+' '+trendTitle+'收入趋势</div>'+renderLineChart(stats.incomeDailyData,'#16A34A','rgba(22,163,74,.12)')+'</div>';
      html+='<div class="chart-card reveal" style="animation-delay:.2s"><div class="chart-card__title">'+icon('bar-chart-3',16)+' 收入来源明细</div>';
      for(var ii=0;ii<stats.incomeCatList.length;ii++){var ic=stats.incomeCatList[ii],meta4=getCatMeta(ic.name,'income'),ipct=(ic.amount/stats.totalIncome*100).toFixed(1);html+='<div class="cat-row"><div class="cat-row__left"><span class="cat-dot" style="background:'+meta4.color+'"></span>'+ic.name+' <span style="font-size:11px;color:var(--text-mute)">('+ipct+'%)</span></div><span class="cat-row__amt" style="color:var(--success)">¥'+ic.amount.toFixed(2)+'</span></div>'}
      html+='</div>';
    }
    if(stats.totalExpense===0&&stats.totalIncome===0){
      html+='<div class="empty">'+icon('bar-chart-3',48)+'<p>'+dimLabel+'暂无数据</p></div>';
    }
    html+='<div class="stats-spacer"></div>';
  }
  html+='<div class="fab" onclick="openVoiceModal()">'+icon('plus',24)+'</div>';
  html+='<div class="tab-bar"><div class="tab-item '+(state.tab==='record'?'active':'')+'" onclick="switchTab(\'record\')">'+icon('receipt',22)+'<span>记账</span></div><div class="tab-item '+(state.tab==='stats'?'active':'')+'" onclick="switchTab(\'stats\')">'+icon('bar-chart-3',22)+'<span>统计</span></div></div>';

  // Voice modal
  if(state.voiceModal){
    var parsedHTML='';
    if(state.parsedRecords.length){
      parsedHTML='<div class="parsed-preview"><div class="parsed-preview__title">'+icon('sparkles',16)+' AI解析结果（共'+state.parsedRecords.length+'笔）</div>';
      for(var pi=0;pi<state.parsedRecords.length;pi++){var r=state.parsedRecords[pi],meta3=getCatMeta(r.category,r.type),aCls=r.type==='income'?'parsed-row__amt--income':'parsed-row__amt--expense';parsedHTML+='<div class="parsed-row"><div class="parsed-row__left">'+icon(meta3.icon,18)+' '+r.category+' · '+r.note+'</div><div class="parsed-row__amt '+aCls+'">'+(r.type==='income'?'+':'-')+'¥'+r.amount.toFixed(2)+'</div></div>'}
      parsedHTML+='</div>';
    }
    var overlayClick='onclick="if(event.target===this)closeVoiceModal()"';
    var isIncome=state.entryMode==='income';
    var modalTitle=isIncome?'收入':'支出';
    // Primary: large auto-focus text input with keyboard mic guide
    var placeholder=isIncome?'输入收入内容...&#10;&#10;例如：收到工资三千，红包两百&#10;理财收益一百二，退款五十&#10;午饭20元还有奶茶5元又有打车30元':'输入支出内容...&#10;&#10;例如：午饭二十块，打车回家三十五&#10;买水果花了五十&#10;午饭20元还有奶茶5元又有打车30元并且高铁100元以及圣罗兰300元';
    var inputHTML='<div class="text-input-area"><textarea id="text-input" style="min-height:120px;font-size:18px;line-height:1.8" placeholder="'+placeholder+'" oninput="textInputChange(this.value)" onkeydown="handleEnterKey(event)" onclick="event.stopPropagation()">'+(state.transcript||'')+'</textarea></div>';
    var guideHTML=isIncome?'<div class="hint-box">'+icon('sparkles',16)+' 当前为收入模式，输入均按收入处理<br>支持中文口语数字（两千、一百二、九块九）<br>支持一句话记多笔，口语连接词自动分段<br>支持：还有、又有、并且、以及、然后、另外、加上<br>口语填充词（啊、额、嗯、哦等）自动过滤<br>来源：工资、奖金、红包、退款、报销、理财、兼职、租金、转账等</div>':'<div class="hint-box">'+icon('sparkles',16)+' 支持中文口语数字（两百、一百二、九块九）<br>支持一句话记多笔账，口语连接词自动分段<br>支持：还有、又有、并且、以及、然后、另外、加上<br>口语填充词（啊、额、嗯、哦等）自动过滤<br>AI自动识别支出/收入与来源<br>收入来源：工资、奖金、红包、退款、报销、理财、兼职、租金、转账等</div>';
    var confirmLabel=isIncome?'确认收入':'确认支出';
    var confirmStyle=isIncome?'background:var(--success);color:#fff':'';
    html+='<div class="modal-overlay" '+overlayClick+'><div class="modal"><div class="modal__title">'+modalTitle+'</div>'+inputHTML+parsedHTML+'<div class="btn-row"><button class="btn btn--outline" onclick="event.stopPropagation();closeVoiceModal()">取消</button><button class="btn btn--primary" style="'+confirmStyle+'" onclick="event.stopPropagation();confirmParsed()" '+(state.parsedRecords.length?'':'disabled')+'>'+confirmLabel+'</button></div>'+guideHTML+'</div></div>';
  }

  // Manual modal
  if(state.manualModal){
    var catList=state.form.type==='income'?INCOME_CATEGORIES:CATEGORIES;
    var catOpts='';
    for(var ci2=0;ci2<catList.length;ci2++)catOpts+='<option value="'+catList[ci2]+'"'+(state.form.category===catList[ci2]?' selected':'')+'>'+catList[ci2]+'</option>';
    var expBtn='state.form.type=\'expense\';state.form.category=\'餐饮\';render()';
    var incBtn='state.form.type=\'income\';state.form.category=\'工资\';render()';
    var ttl=state.form.type==='expense'?'手动记账':'手动入账';
    var ph=state.form.type==='expense'?'如：午饭、打车':'如：发工资、红包、理财收益';
    html+='<div class="modal-overlay" onclick="if(event.target===this)closeManualModal()"><div class="modal"><div class="modal__title">'+ttl+'</div><div class="field"><label class="field__label">类型</label><div class="type-toggle"><button class="type-toggle__btn '+(state.form.type==='expense'?'type-toggle__btn--active':'')+'" onclick="'+expBtn+'">支出</button><button class="type-toggle__btn '+(state.form.type==='income'?'type-toggle__btn--active':'')+'" onclick="'+incBtn+'">收入</button></div></div><div class="field"><label class="field__label">金额</label><input class="field__input" type="number" step="0.01" placeholder="0.00" value="'+state.form.amount+'" oninput="state.form.amount=this.value"></div><div class="field"><label class="field__label">来源分类</label><select class="field__select" onchange="state.form.category=this.value">'+catOpts+'</select></div><div class="field"><label class="field__label">备注</label><input class="field__input" type="text" placeholder="'+ph+'" value="'+state.form.note+'" oninput="state.form.note=this.value"></div><div class="btn-row"><button class="btn btn--outline" onclick="closeManualModal()">取消</button><button class="btn btn--primary" onclick="saveManual()">保存</button></div></div></div>';
  }
  // Config modal（备份与恢复）
  if(state.configModal){
    var localCount=state.txs.length;
    var statusHTML=state.importStatus?'<div class="import-status '+(state.importStatus.type==='ok'?'import-status--ok':'import-status--err')+'">'+state.importStatus.msg+'</div>':'';
    var fileField='<div class="field"><label class="field__label">添加备份文件</label><label class="config-filepick">'+icon('upload',18)+' 点击选择之前下载的备份文件<input type="file" accept="application/json,.json" onchange="importBackup(this.files[0])" style="display:none"></label></div>';
    var guide='<div class="backup-note">本机当前记录：<b>'+localCount+'</b> 条<br><br>'
      +'<b>换机 / 换浏览器使用方法：</b><br>'
      +'1. 在旧设备点首页「<b>导出</b>」，下载备份文件并保存好（可发到微信、网盘）；<br>'
      +'2. 在新设备打开本页面，点「<b>配置</b>」，选择该备份文件即可恢复；<br>'
      +'3. 恢复为<b>合并方式</b>：不覆盖本机已有记录、不重复，可多次导入。</div>';
    html+='<div class="modal-overlay" onclick="if(event.target===this)closeConfigModal()"><div class="modal"><div class="modal__title">配置</div>'+guide+fileField+statusHTML+'<div class="btn-row"><button class="btn btn--primary" style="flex:1" onclick="closeConfigModal()">完成</button></div></div></div>';
  }
  // Mapping modal（自定义映射）
  if(state.mappingModal){
    var mappings=getCustomMappings();
    var mapListHTML='';
    if(mappings.length){
      mapListHTML='<div class="mapping-list">';
      for(var mi=0;mi<mappings.length;mi++){var mp=mappings[mi],mpMeta=getCatMeta(mp.category,mp.type),mpTypeCls=mp.type==='income'?'mapping-item__type--income':'mapping-item__type--expense',mpTypeLabel=mp.type==='income'?'收入':'支出';
        mapListHTML+='<div class="mapping-item"><div class="mapping-item__left">'+icon(mpMeta.icon,18)+' <span class="mapping-item__kw">'+mp.keyword+'</span> <span class="mapping-item__arrow">→</span> <span class="mapping-item__cat">'+mp.category+'</span> <span class="mapping-item__type '+mpTypeCls+'">'+mpTypeLabel+'</span></div><button class="tx-delete" onclick="deleteMapping('+mp.id+')">删除</button></div>';
      }
      mapListHTML+='</div>';
    }else{
      mapListHTML='<div class="mapping-empty">暂无自定义映射，请在下方添加</div>';
    }
    var mapCatList=state.mappingForm.type==='income'?INCOME_CATEGORIES:CATEGORIES;
    var mapCatOpts='';
    for(var mci=0;mci<mapCatList.length;mci++)mapCatOpts+='<option value="'+mapCatList[mci]+'"'+(state.mappingForm.category===mapCatList[mci]?' selected':'')+'>'+mapCatList[mci]+'</option>';
    var mapExpBtn="state.mappingForm.type='expense';state.mappingForm.category='餐饮';render()";
    var mapIncBtn="state.mappingForm.type='income';state.mappingForm.category='工资';render()";
    var mapGuide='<div class="hint-box">'+icon('sparkles',16)+' 输入一个关键词（如：圣罗兰、手办、剧本杀），选择对应分类。<br>保存后，下次输入包含该关键词的内容时，自动归入所选分类。<br>自定义映射优先于系统默认识别。</div>';
    html+='<div class="modal-overlay" onclick="if(event.target===this)closeMappingModal()"><div class="modal"><div class="modal__title">自定义映射</div>'+mapListHTML+'<div class="field"><label class="field__label">类型</label><div class="type-toggle"><button class="type-toggle__btn '+(state.mappingForm.type==='expense'?'type-toggle__btn--active':'')+'" onclick="'+mapExpBtn+'">支出</button><button class="type-toggle__btn '+(state.mappingForm.type==='income'?'type-toggle__btn--active':'')+'" onclick="'+mapIncBtn+'">收入</button></div></div><div class="field"><label class="field__label">关键词</label><input class="field__input" type="text" placeholder="输入关键词，如：圣罗兰" value="'+state.mappingForm.keyword+'" oninput="state.mappingForm.keyword=this.value"></div><div class="field"><label class="field__label">映射分类</label><select class="field__select" onchange="state.mappingForm.category=this.value">'+mapCatOpts+'</select></div><div class="btn-row"><button class="btn btn--outline" onclick="closeMappingModal()">取消</button><button class="btn btn--primary" onclick="saveMapping()">添加映射</button></div>'+mapGuide+'</div></div>';
  }
  if(state.toast)html+='<div class="toast">'+state.toast+'</div>';
  app.innerHTML=html;
}

function init(){
  var VER='v8_income';
  if(localStorage.getItem('aiBillVer')!==VER){
    localStorage.removeItem('aiBillTxs');
    localStorage.setItem('aiBillVer',VER);
  }
  state.txs=JSON.parse(localStorage.getItem('aiBillTxs')||'[]');
  var appEl=document.getElementById('app');
  appEl.classList.add('app--intro');
  render();
  setTimeout(function(){appEl.classList.remove('app--intro')},700);
}

window.state=state;window.icon=icon;window.render=render;window.switchTab=switchTab;
window.openVoiceModal=openVoiceModal;window.closeVoiceModal=closeVoiceModal;
window.startVoice=startVoice;window.stopVoice=stopVoice;
window.confirmParsed=confirmParsed;window.openManualModal=openManualModal;window.closeManualModal=closeManualModal;
window.saveManual=saveManual;window.deleteTx=deleteTx;window.textInputChange=textInputChange;
window.exportBackup=exportBackup;window.openConfigModal=openConfigModal;window.closeConfigModal=closeConfigModal;window.importBackup=importBackup;
window.openMappingModal=openMappingModal;window.closeMappingModal=closeMappingModal;window.saveMapping=saveMapping;window.deleteMapping=deleteMapping;
document.addEventListener('DOMContentLoaded',init);
</script>
